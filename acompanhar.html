<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar pedido</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><h1>Acompanhar pedido</h1><div class="caixa"><h2 id="titulo">Carregando...</h2><div id="passos"></div><p id="info"></p><div id="mapa" class="map"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/supabase-config.js"></script><script src="/app.js"></script><script>
const token=new URLSearchParams(location.search).get("token"),mapa=L.map("mapa").setView([-6.4,-48.5],13);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(mapa);let dm,cm;
async function load(){const p=await must(sb.from("pedidos").select("*").eq("tracking_token",token).single());titulo.textContent="Pedido #"+p.numero;const seq=["aguardando","aceito","producao","pronto","retirado","em_rota","Finalizado"],idx=seq.indexOf(p.status);passos.innerHTML=seq.map((s,i)=>`<div class="item" style="border-left:4px solid ${i<=idx?"#22c55e":"#475569"}">${statusLabel(s)}</div>`).join("");if(p.latitude){cm?cm.setLatLng([p.latitude,p.longitude]):cm=L.marker([p.latitude,p.longitude]).addTo(mapa).bindPopup("Sua entrega")}if(p.rota_id){const r=await must(sb.from("rotas_entrega").select("*").eq("id",p.rota_id).single());const me=await must(sb.from("rota_paradas").select("*").eq("pedido_id",p.id).single());const before=await must(sb.from("rota_paradas").select("id").eq("rota_id",p.rota_id).lt("ordem",me.ordem).eq("status","pendente"));info.textContent=before.length?`Há ${before.length} entrega(s) antes da sua.`:"Seu pedido é a próxima entrega.";if(r.latitude_atual){dm?dm.setLatLng([r.latitude_atual,r.longitude_atual]):dm=L.marker([r.latitude_atual,r.longitude_atual]).addTo(mapa).bindPopup("Entregador");mapa.fitBounds([[p.latitude,p.longitude],[r.latitude_atual,r.longitude_atual]])}}}
load();setInterval(load,12000);
</script></body></html>
