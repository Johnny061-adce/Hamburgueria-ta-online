<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><link rel=stylesheet href=/styles.css><link rel=stylesheet href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>Acompanhar</title></head><body><header class=top><div class=brand>Acompanhar pedido</div></header><main class=wrap><div id=msg class="msg hidden"></div><div class=card><h2 id=title>Carregando...</h2><div id=steps></div><p id=info></p><div id=map class=map></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src=/config.js></script><script src=/app.js></script><script>
const token=new URLSearchParams(location.search).get('token'),map=L.map('map').setView([-6.4,-48.5],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let dm,cm;async function load(){try{const d=await rpc('public_track_order',{p_token:token});title.textContent='Pedido #'+d.numero;const a=['aguardando','aceito','producao','pronto','retirado','em_rota','entregue'],ix=a.indexOf(d.status);steps.innerHTML=a.map((s,i)=>`<div class=item style="border-left:4px solid ${i<=ix?'#22c55e':'#475569'}">${label(s)}</div>`).join('');info.textContent=d.paradas_antes?`Há ${d.paradas_antes} entrega(s) antes da sua.`:'Seu pedido é a próxima entrega.';if(d.cliente_lat){cm?cm.setLatLng([d.cliente_lat,d.cliente_lng]):cm=L.marker([d.cliente_lat,d.cliente_lng]).addTo(map).bindPopup('Sua entrega')}if(d.entregador_lat){dm?dm.setLatLng([d.entregador_lat,d.entregador_lng]):dm=L.marker([d.entregador_lat,d.entregador_lng]).addTo(map).bindPopup('Entregador');map.fitBounds([[d.cliente_lat,d.cliente_lng],[d.entregador_lat,d.entregador_lng]])}}catch(e){show(e.message)}}load();setInterval(load,12000);
</script></body></html>
