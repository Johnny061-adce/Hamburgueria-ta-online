<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><link rel=stylesheet href=/styles.css><link rel=stylesheet href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>Entregador</title></head><body><header class=top><div class=brand>Entregador</div><button class="btn red" onclick=logout()>Sair</button></header><main class=wrap><div id=msg class="msg hidden"></div><section class=card><h2>Pedidos prontos</h2><div id=ready></div><button id=route class="btn orange">Montar melhor rota</button></section><section class=card><h2>Minha rota</h2><div id=current></div><div id=map class=map></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src=/config.js></script><script src=/app.js></script><script>
const S=role('admin','entregador');let readyList=[],sel=new Set(),routeData=null,watch=null;const map=L.map('map').setView([-6.4,-48.5],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
async function load(){const d=await rpc('driver_dashboard',{p_token:S.token});readyList=d.prontos||[];routeData=d.rota||null;ready.innerHTML=readyList.map(o=>`<label class=item style="display:block"><input type=checkbox data-id="${o.id}"> #${o.numero} • ${esc(o.cidade||'')} • ${esc(o.endereco||'')} • R$ ${money(o.taxa)}</label>`).join('');render()}
ready.onchange=e=>{if(e.target.dataset.id)e.target.checked?sel.add(e.target.dataset.id):sel.delete(e.target.dataset.id)};
function hav(a,b){const R=6371,d1=(b.lat-a.lat)*Math.PI/180,d2=(b.lng-a.lng)*Math.PI/180,x=Math.sin(d1/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function opt(ps,start){let r=[...ps],o=[],c=start;while(r.length){r.sort((a,b)=>hav(c,a)-hav(c,b));c=r.shift();o.push(c)}return o}
route.onclick=()=>navigator.geolocation.getCurrentPosition(async p=>{try{const c=readyList.filter(o=>sel.has(o.id)).map(o=>({id:o.id,lat:+o.latitude,lng:+o.longitude})).filter(x=>isFinite(x.lat)&&isFinite(x.lng));if(!c.length)throw Error('Selecione pedidos com localização');const ord=opt(c,{lat:p.coords.latitude,lng:p.coords.longitude});await rpc('driver_create_route',{p_token:S.token,p_order_ids:ord.map(x=>x.id)});sel.clear();load()}catch(e){show(e.message)}},e=>show(e.message),{enableHighAccuracy:true});
function render(){if(!routeData){current.innerHTML='<p>Nenhuma rota ativa.</p>';return}const ps=routeData.paradas||[];current.innerHTML=`<p><b>Rota #${routeData.codigo}</b></p>`+ps.map((p,i)=>`<div class=item>${i+1}ª • #${p.numero} • ${esc(p.endereco)} ${p.status_parada==='pendente'?`<button class="btn ok" data-done="${p.id_parada}">Concluir</button>`:'✓'}</div>`).join('')+`<div class=actions><button id=start class="btn blue">Iniciar rota</button><button id=gm class="btn orange">Abrir no Google Maps</button></div>`;ps.forEach((p,i)=>{if(isFinite(+p.latitude))L.marker([+p.latitude,+p.longitude]).addTo(map).bindPopup((i+1)+'ª parada')});start.onclick=track;gm.onclick=()=>{if(!ps.length)return;const d=ps.at(-1),w=ps.slice(0,-1).map(p=>p.latitude+','+p.longitude).join('|');open(`https://www.google.com/maps/dir/?api=1&destination=${d.latitude},${d.longitude}&waypoints=${encodeURIComponent(w)}&travelmode=driving`,'_blank')}}
current.onclick=async e=>{const b=e.target.closest('[data-done]');if(!b)return;await rpc('driver_finish_stop',{p_token:S.token,p_stop_id:b.dataset.done});load()};
function track(){if(watch!=null)return;watch=navigator.geolocation.watchPosition(p=>rpc('driver_location',{p_token:S.token,p_lat:p.coords.latitude,p_lng:p.coords.longitude,p_accuracy:p.coords.accuracy}),e=>show(e.message),{enableHighAccuracy:true,maximumAge:5000});show('Rastreamento iniciado')}
sb.channel('driver').on('postgres_changes',{event:'*',schema:'public',table:'rotas_entrega'},load).subscribe();load();
</script></body></html>
