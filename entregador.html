<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entregador</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body>
<div class="topo"><h2>Entregador</h2><button class="btn btn-red" onclick="logout()">Sair</button></div><div id="msg" class="msg hidden"></div>
<div class="caixa"><h2>Pedidos prontos</h2><div id="prontos"></div><button id="montar" class="btn btn-gold">Montar rota</button></div>
<div class="caixa"><h2>Minha rota</h2><div id="rota"></div><div id="mapa" class="map"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/supabase-config.js"></script><script src="/app.js"></script><script>
const S=requireRole("entregador","admin");let selected=new Set(),ready=[],route=null,watch=null;const mapa=L.map("mapa").setView([-6.4,-48.5],13);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(mapa);
async function load(){ready=await must(sb.from("pedidos").select("*").eq("status","pronto").order("criado_em"));const rs=await must(sb.from("rotas_entrega").select("*").eq("entregador_usuario",S.usuario).in("status",["planejada","em_rota"]).order("criado_em",{ascending:false}).limit(1));route=rs[0]||null;prontos.innerHTML=ready.map(p=>`<label class="item" style="display:block"><input type="checkbox" data-id="${p.id}"> #${p.numero} • ${esc(p.cidade_nome||"")} • ${esc(p.endereco||"")} • R$ ${money(p.taxa_entrega)}</label>`).join("");renderRoute()}
prontos.onchange=e=>{if(e.target.dataset.id)e.target.checked?selected.add(e.target.dataset.id):selected.delete(e.target.dataset.id)};
function distance(a,b){const R=6371,d1=(b.lat-a.lat)*Math.PI/180,d2=(b.lng-a.lng)*Math.PI/180,z=Math.sin(d1/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(z))}
function optimize(points,start){let rest=[...points],out=[],cur=start;while(rest.length){rest.sort((a,b)=>distance(cur,a)-distance(cur,b));cur=rest.shift();out.push(cur)}return out}
montar.onclick=()=>navigator.geolocation.getCurrentPosition(async p=>{try{const chosen=ready.filter(x=>selected.has(String(x.id))||selected.has(x.id)).map(x=>({id:x.id,lat:+x.latitude,lng:+x.longitude})).filter(x=>isFinite(x.lat)&&isFinite(x.lng));if(!chosen.length)throw Error("Selecione pedidos com localização.");const order=optimize(chosen,{lat:p.coords.latitude,lng:p.coords.longitude});const r=await must(sb.from("rotas_entrega").insert({codigo:String(Date.now()).slice(-8),entregador_usuario:S.usuario,status:"planejada"}).select().single());await must(sb.from("rota_paradas").insert(order.map((x,i)=>({rota_id:r.id,pedido_id:x.id,ordem:i+1,status:"pendente"}))));await must(sb.from("pedidos").update({status:"retirado",entregador_usuario:S.usuario,rota_id:r.id}).in("id",order.map(x=>x.id)));selected.clear();load()}catch(e){msg.textContent=e.message;msg.classList.remove("hidden")}},e=>{msg.textContent=e.message;msg.classList.remove("hidden")},{enableHighAccuracy:true});
async function renderRoute(){if(!route){rota.innerHTML="<p>Nenhuma rota ativa.</p>";return}const ps=await must(sb.from("rota_paradas").select("*,pedidos(*)").eq("rota_id",route.id).order("ordem"));rota.innerHTML=`<p><b>Rota #${route.codigo}</b></p>`+ps.map((x,i)=>`<div class="item">${i+1}ª parada • Pedido #${x.pedidos.numero} • ${esc(x.pedidos.endereco||"")} ${x.status==="pendente"?`<button class="btn btn-ok" data-done="${x.id}">Concluir</button>`:"✓"}</div>`).join("")+`<div class="acoes"><button id="iniciar" class="btn btn-blue">Iniciar rota</button><button id="maps" class="btn btn-gold">Abrir no Google Maps</button></div>`;ps.forEach((x,i)=>{const p=x.pedidos;if(isFinite(+p.latitude))L.marker([+p.latitude,+p.longitude]).addTo(mapa).bindPopup((i+1)+"ª parada")});iniciar.onclick=startTracking;maps.onclick=()=>{if(!ps.length)return;const d=ps.at(-1).pedidos,w=ps.slice(0,-1).map(x=>x.pedidos.latitude+","+x.pedidos.longitude).join("|");open(`https://www.google.com/maps/dir/?api=1&destination=${d.latitude},${d.longitude}&waypoints=${encodeURIComponent(w)}&travelmode=driving`,"_blank")}}
rota.onclick=async e=>{const b=e.target.closest("[data-done]");if(!b)return;const stop=await must(sb.from("rota_paradas").select("*,pedidos(*)").eq("id",b.dataset.done).single());await must(sb.from("rota_paradas").update({status:"entregue",entregue_em:new Date().toISOString()}).eq("id",stop.id));await must(sb.from("pedidos").update({status:"Finalizado",finalizado_em:new Date().toISOString()}).eq("id",stop.pedido_id));await must(sb.from("historico_corridas").insert({rota_id:route.id,pedido_id:stop.pedido_id,entregador_nome:S.usuario,numero_pedido:stop.pedidos.numero,cidade:stop.pedidos.cidade_nome,taxa:stop.pedidos.taxa_entrega}));const rest=await must(sb.from("rota_paradas").select("id").eq("rota_id",route.id).eq("status","pendente"));if(!rest.length)await must(sb.from("rotas_entrega").update({status:"finalizada",finalizado_em:new Date().toISOString()}).eq("id",route.id));load()};
function startTracking(){if(watch!=null)return;watch=navigator.geolocation.watchPosition(async p=>{await must(sb.from("rotas_entrega").update({status:"em_rota",latitude_atual:p.coords.latitude,longitude_atual:p.coords.longitude,precisao:p.coords.accuracy,iniciado_em:route.iniciado_em||new Date().toISOString()}).eq("id",route.id));await must(sb.from("pedidos").update({status:"em_rota"}).eq("rota_id",route.id).neq("status","Finalizado"))},e=>{msg.textContent=e.message;msg.classList.remove("hidden")},{enableHighAccuracy:true,maximumAge:5000})}
sb.channel("driver").on("postgres_changes",{event:"*",schema:"public",table:"rotas_entrega"},load).subscribe();load();
</script></body></html>
