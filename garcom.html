<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><link rel=stylesheet href=/styles.css><title>Garçom</title></head><body><header class=top><div class=brand>Garçom</div><div class=actions><a class="btn orange" href=/index.html>Novo pedido</a><button class="btn red" onclick=logout()>Sair</button></div></header><main class=wrap><div class=card><h2>Pedidos recentes</h2><div id=orders></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src=/config.js></script><script src=/app.js></script><script>const S=role('admin','painel','garcom');async function load(){const d=await rpc('staff_orders',{p_token:S.token});orders.innerHTML=(d||[]).slice(0,30).map(o=>`<div class=item><b>#${o.numero}</b> • ${esc(o.cliente||'-')} • ${label(o.status)} • R$ ${money(o.total)}</div>`).join('')}load()</script></body></html>
