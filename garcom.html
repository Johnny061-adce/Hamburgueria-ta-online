<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><link rel=stylesheet href=/styles.css><title>Garçom</title></head><body><div class=topo><h2>Garçom</h2><div class=acoes><a class="btn btn-gold" href="/">Novo pedido</a><button class="btn btn-red" onclick=logout()>Sair</button></div></div><div class=caixa><h2>Pedidos recentes</h2><div id=lista></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src=/supabase-config.js></script><script src=/app.js></script><script>requireRole("garcom","painel","admin");async function load(){const p=await must(sb.from("pedidos").select("*").order("criado_em",{ascending:false}).limit(50));lista.innerHTML=p.map(x=>`<div class=item><b>#${x.numero}</b> • ${esc(x.cliente||"-")} • ${statusLabel(x.status)} • R$ ${money(x.total)}</div>`).join("")}load()</script></body></html>
