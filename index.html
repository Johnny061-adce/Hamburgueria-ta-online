<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Cardápio online da Tá Online Hamburgueria">
  <title>Tá Online Hamburgueria</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root{--bg:#0b1120;--card:#172033;--text:#f8fafc;--muted:#cbd5e1;--brand:#fb923c;--brand2:#fbbf24;--ok:#22c55e}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;padding-bottom:104px}
    button,input,select,textarea{font:inherit}.hero{background:linear-gradient(135deg,#090d16,#1f2937);border-bottom:3px solid var(--brand);padding:22px 16px;text-align:center}
    .logo{font-size:34px;font-weight:900;color:var(--brand)}.sub{color:var(--muted);margin-top:5px}.status{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:bold}
    .aberta{background:#14532d;color:#bbf7d0}.fechada{background:#7f1d1d;color:#fecaca}.container{max-width:1100px;margin:auto;padding:16px}.painel{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px}
    .busca{width:100%;border:1px solid #334155;background:#fff;color:#111;padding:13px;border-radius:12px}.categorias{display:flex;gap:8px;overflow:auto;padding:10px 0 2px}.cat-btn{white-space:nowrap;border:0;background:#273449;color:#fff;padding:10px 14px;border-radius:999px;font-weight:bold}.cat-btn.ativa{background:var(--brand);color:#111}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.categoria{background:var(--card);border-radius:16px;padding:15px;align-self:start}.categoria h2{margin:0 0 10px;color:var(--brand2);font-size:23px;text-transform:uppercase;border-bottom:1px solid #334155;padding-bottom:8px}
    .produto{padding:13px 0;border-bottom:1px solid #2b3648}.produto:last-child{border-bottom:0}.linha-produto{display:grid;grid-template-columns:1fr auto;gap:10px}.nome{font-weight:800;text-transform:uppercase}.preco{font-weight:900;color:var(--brand2);white-space:nowrap}.descricao{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35}
    .produto-baixo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.obs-item{flex:1;min-width:0;border:0;border-radius:9px;padding:9px}.qtd{display:flex;align-items:center;gap:8px}.qtd button{width:36px;height:36px;border:0;border-radius:50%;background:var(--brand);color:#fff;font-size:22px;font-weight:bold}.qtd span{min-width:24px;text-align:center;font-weight:bold}.esgotado{opacity:.5}.tag-esgotado{color:#fca5a5;font-weight:bold;font-size:12px;margin-top:5px}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.campo{display:flex;flex-direction:column;gap:6px}.campo label{font-weight:bold;font-size:14px}.campo input,.campo select,.campo textarea{width:100%;border:0;border-radius:10px;padding:12px}.campo textarea{min-height:74px;resize:vertical}.campo.full{grid-column:1/-1}.mesa-bloqueada{background:#374151!important;color:#fff!important;cursor:not-allowed}
    .rodape-fixo{position:fixed;left:0;right:0;bottom:0;background:rgba(10,15,25,.97);border-top:2px solid var(--brand);padding:11px 14px;z-index:20}.rodape-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.total{font-size:24px;font-weight:900;color:#fde68a}.enviar{border:0;border-radius:12px;background:var(--ok);color:#fff;padding:14px 20px;font-weight:900;font-size:17px}.enviar:disabled{opacity:.55}
    .mensagem{display:none;margin:16px 0;padding:14px;border-radius:12px;font-weight:bold}.mensagem.ok{display:block;background:#14532d;color:#bbf7d0}.mensagem.erro{display:block;background:#7f1d1d;color:#fecaca}.vazio{text-align:center;color:var(--muted);padding:40px}
    @media(max-width:780px){.grid,.form-grid{grid-template-columns:1fr}.campo.full{grid-column:auto}.logo{font-size:29px}.total{font-size:20px}.enviar{padding:13px 15px}}
  </style>
</head>
<body>
  <header class="hero"><div class="logo">TÁ ONLINE</div><div class="sub">HAMBURGUERIA • Faça seu pedido</div><div id="statusLoja" class="status aberta">Carregando...</div></header>
  <main class="container">
    <section class="painel"><input id="busca" class="busca" placeholder="Buscar hambúrguer, bebida, pastel..."><div id="filtros" class="categorias"></div></section>
    <div id="mensagem" class="mensagem"></div><div id="cardapio" class="grid"><div class="vazio">Carregando cardápio...</div></div>
    <section class="painel" style="margin-top:18px"><h2 style="margin-top:0;color:#fbbf24">Dados do pedido</h2><div class="form-grid">
      <div class="campo"><label>Nome</label><input id="cliente" maxlength="120" placeholder="Seu nome"></div>
      <div class="campo"><label>Telefone</label><input id="telefone" inputmode="tel" maxlength="30" placeholder="(62) 99999-9999"></div>
      <div class="campo"><label>Tipo do pedido</label><select id="tipoPedido"><option value="delivery">Delivery</option><option value="retirada">Retirada</option><option value="mesa">Mesa</option></select></div>
      <div class="campo" id="campoMesa"><label>Mesa</label><input id="mesa" maxlength="20" placeholder="Número da mesa"></div>
      <div class="campo full" id="campoEndereco"><label>Endereço de entrega</label><input id="endereco" maxlength="300" placeholder="Rua, número, bairro e referência"></div>
      <div class="campo"><label>Pagamento</label><select id="formaPagamento"><option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option><option>Pagar no local</option></select></div>
      <div class="campo full"><label>Observação geral</label><textarea id="observacao" maxlength="1000" placeholder="Ex.: tocar a campainha, retirar cebola..."></textarea></div>
    </div></section>
  </main>
  <footer class="rodape-fixo"><div class="rodape-inner"><div class="total">Total: R$ <span id="total">0,00</span></div><button id="btnEnviar" class="enviar">Fazer pedido</button></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ==========================================================
    // CONFIGURAÇÃO DO SUPABASE
    // Cole abaixo a URL e a Publishable Key do MESMO projeto
    // em que você executou o SQL do cardápio.
    // ==========================================================
    const SUPABASE_URL = "https://iqvqdazmxoydvfllfpwp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_R-sG8jbpSpb9SSsPkfDDgA_5y3JcjZ2";

    function configuracaoSupabaseValida(){
      const urlValida =
        typeof SUPABASE_URL === "string" &&
        /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SUPABASE_URL.trim());

      const chaveValida =
        typeof SUPABASE_KEY === "string" &&
        SUPABASE_KEY.trim().length > 20 &&
        !SUPABASE_KEY.includes("COLE_AQUI");

      return urlValida && chaveValida;
    }

    let sb = null;

    if(configuracaoSupabaseValida()){
      sb = window.supabase.createClient(
        SUPABASE_URL.trim().replace(/\/$/, ""),
        SUPABASE_KEY.trim()
      );
    }
    let categorias=[],produtos=[],carrinho=new Map(),taxaEntrega=0,lojaAberta=true,categoriaSelecionada="Todas";
    const $=id=>document.getElementById(id),moeda=v=>Number(v||0).toFixed(2).replace(".",","),esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function mostrarMensagem(texto,tipo="ok"){const el=$("mensagem");el.className="mensagem "+tipo;el.textContent=texto;el.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>el.className="mensagem",7000)}
    async function carregar(){
      if(!sb){
        $("statusLoja").textContent = "Configuração pendente";
        $("statusLoja").className = "status fechada";
        $("btnEnviar").disabled = true;
        $("cardapio").innerHTML =
          '<div class="vazio">' +
          '<strong>Conexão com o Supabase não configurada.</strong><br><br>' +
          'Abra o index.html e preencha SUPABASE_URL e SUPABASE_KEY.' +
          '</div>';
        mostrarMensagem(
          "Preencha a URL e a Publishable Key do Supabase dentro do index.html.",
          "erro"
        );
        return;
      }

      try{const [{data:cfg,error:e1},{data:cats,error:e2},{data:prods,error:e3}]=await Promise.all([sb.from("configuracoes").select("*").eq("id",1).maybeSingle(),sb.from("categorias").select("*").eq("ativo",true).order("ordem"),sb.from("produtos").select("*, categorias(nome,coluna,ordem)").eq("ativo",true).order("ordem")]);if(e1||e2||e3)throw(e1||e2||e3);taxaEntrega=Number(cfg?.taxa_entrega||0);lojaAberta=cfg?.loja_aberta!==false;categorias=cats||[];produtos=prods||[];$("statusLoja").textContent=lojaAberta?"Aberto para pedidos":"Fechado no momento";$("statusLoja").className="status "+(lojaAberta?"aberta":"fechada");$("btnEnviar").disabled=!lojaAberta;renderFiltros();renderCardapio();atualizarTotal()}catch(e){console.error(e);$("cardapio").innerHTML='<div class="vazio">Não foi possível carregar o cardápio. Confira a URL, a chave e o SQL do Supabase.</div>';mostrarMensagem("Erro ao carregar o cardápio.","erro")}}
    function renderFiltros(){const nomes=["Todas",...categorias.map(c=>c.nome)];$("filtros").innerHTML=nomes.map(nome=>`<button class="cat-btn ${nome===categoriaSelecionada?"ativa":""}" data-cat="${esc(nome)}">${esc(nome)}</button>`).join("")}
    function renderCardapio(){const termo=$("busca").value.trim().toLowerCase();const filtrados=produtos.filter(p=>{const cat=p.categorias?.nome||"";return(categoriaSelecionada==="Todas"||cat===categoriaSelecionada)&&(!termo||`${p.nome} ${p.descricao} ${cat}`.toLowerCase().includes(termo))});const grupos=new Map();filtrados.forEach(p=>{const cat=p.categorias?.nome||"Outros";if(!grupos.has(cat))grupos.set(cat,[]);grupos.get(cat).push(p)});if(!filtrados.length){$("cardapio").innerHTML='<div class="vazio">Nenhum item encontrado.</div>';return}$("cardapio").innerHTML=categorias.filter(c=>grupos.has(c.nome)).map(c=>`<section class="categoria"><h2>${esc(c.nome)}</h2>${grupos.get(c.nome).map(produtoHtml).join("")}</section>`).join("")}
    function produtoHtml(p){const item=carrinho.get(p.id)||{quantidade:0,observacao:""};const indisponivel=p.esgotado||(p.controlar_estoque&&Number(p.estoque)<=0);return `<article class="produto ${indisponivel?"esgotado":""}"><div class="linha-produto"><div><div class="nome">${esc(p.nome)}</div><div class="descricao">${esc(p.descricao||"")}</div>${indisponivel?'<div class="tag-esgotado">ESGOTADO</div>':""}</div><div class="preco">R$ ${moeda(p.preco)}</div></div><div class="produto-baixo"><input class="obs-item" data-obs="${p.id}" ${indisponivel?"disabled":""} placeholder="Observação deste item" value="${esc(item.observacao)}"><div class="qtd"><button type="button" data-qtd="${p.id}" data-delta="-1" ${indisponivel?"disabled":""}>−</button><span id="qtd-${p.id}">${item.quantidade}</span><button type="button" data-qtd="${p.id}" data-delta="1" ${indisponivel?"disabled":""}>+</button></div></div></article>`}
    function alterarQtd(id,delta){const p=produtos.find(x=>Number(x.id)===Number(id));if(!p||p.esgotado)return;const atual=carrinho.get(p.id)||{quantidade:0,observacao:""};let nova=Math.max(0,atual.quantidade+delta);if(p.controlar_estoque)nova=Math.min(nova,Number(p.estoque||0));if(nova===0&&!atual.observacao)carrinho.delete(p.id);else carrinho.set(p.id,{...atual,quantidade:nova});const el=$("qtd-"+p.id);if(el)el.textContent=nova;atualizarTotal()}
    function atualizarTotal(){let subtotal=0;carrinho.forEach((item,id)=>{const p=produtos.find(x=>Number(x.id)===Number(id));if(p)subtotal+=Number(p.preco)*Number(item.quantidade)});const taxa=$("tipoPedido").value==="delivery"?taxaEntrega:0;$("total").textContent=moeda(subtotal+taxa)}
    function ajustarTipo(){const tipo=$("tipoPedido").value;$("campoMesa").style.display=tipo==="mesa"?"flex":"none";$("campoEndereco").style.display=tipo==="delivery"?"flex":"none";atualizarTotal()}
    function aplicarMesaDaUrl(){const mesaUrl=new URLSearchParams(location.search).get("mesa");if(!mesaUrl)return;$("tipoPedido").value="mesa";$("mesa").value=mesaUrl;$("mesa").readOnly=true;$("mesa").classList.add("mesa-bloqueada");ajustarTipo()}
    async function enviarPedido(){
      if(!sb){
        mostrarMensagem("Configure primeiro a URL e a Publishable Key do Supabase.", "erro");
        return;
      }
      if(!lojaAberta){mostrarMensagem("A loja está fechada no momento.","erro");return}const itens=[];carrinho.forEach((item,id)=>{if(item.quantidade>0)itens.push({produto_id:Number(id),quantidade:item.quantidade,observacao:item.observacao||""})});if(!itens.length){mostrarMensagem("Selecione pelo menos um item.","erro");return}const tipo=$("tipoPedido").value;if(tipo==="mesa"&&!$("mesa").value.trim()){mostrarMensagem("Informe o número da mesa.","erro");return}if(tipo==="delivery"&&!$("endereco").value.trim()){mostrarMensagem("Informe o endereço de entrega.","erro");return}const btn=$("btnEnviar");btn.disabled=true;btn.textContent="Enviando...";try{const {data,error}=await sb.rpc("criar_pedido",{p_cliente:$("cliente").value.trim(),p_telefone:$("telefone").value.trim(),p_tipo_pedido:tipo,p_mesa:$("mesa").value.trim(),p_endereco:$("endereco").value.trim(),p_observacao:$("observacao").value.trim(),p_forma_pagamento:$("formaPagamento").value,p_itens:itens});if(error)throw error;const retorno=Array.isArray(data)?data[0]:data;mostrarMensagem(`Pedido #${retorno?.numero_pedido||""} enviado com sucesso! Total: R$ ${moeda(retorno?.total_pedido||0)}`);carrinho.clear();renderCardapio();atualizarTotal();$("cliente").value="";$("telefone").value="";$("observacao").value="";if(!$("mesa").readOnly)$("mesa").value="";if(tipo!=="mesa")$("endereco").value=""}catch(e){console.error(e);mostrarMensagem(e.message||"Não foi possível enviar o pedido.","erro")}finally{btn.disabled=!lojaAberta;btn.textContent="Fazer pedido"}}
    $("filtros").addEventListener("click",e=>{const btn=e.target.closest("[data-cat]");if(!btn)return;categoriaSelecionada=btn.dataset.cat;renderFiltros();renderCardapio()});$("cardapio").addEventListener("click",e=>{const btn=e.target.closest("[data-qtd]");if(!btn)return;alterarQtd(Number(btn.dataset.qtd),Number(btn.dataset.delta))});$("cardapio").addEventListener("input",e=>{const input=e.target.closest("[data-obs]");if(!input)return;const id=Number(input.dataset.obs),atual=carrinho.get(id)||{quantidade:0,observacao:""};carrinho.set(id,{...atual,observacao:input.value})});$("busca").addEventListener("input",renderCardapio);$("tipoPedido").addEventListener("change",ajustarTipo);$("btnEnviar").addEventListener("click",enviarPedido);
    if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/service-worker.js").catch(console.error));ajustarTipo();aplicarMesaDaUrl();carregar();
  </script>
</body>
</html>
