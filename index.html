<!doctype html><html lang=pt-BR><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=/styles.css><link rel=stylesheet href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>Tá Online</title></head><body><header class=top><div><div class=brand>TÁ ONLINE</div><div class=muted>Faça seu pedido</div></div><a class="btn blue" href=/login.html>Equipe</a></header><main class=wrap><div id=msg class="msg hidden"></div><div id=menu class=grid></div><div class=card><h2>Dados do pedido</h2><div class=grid><div class=field><label>Nome</label><input id=cliente></div><div class=field><label>Telefone</label><input id=telefone></div><div class=field><label>Tipo</label><select id=tipo><option value=delivery>Delivery</option><option value=retirada>Retirada</option><option value=mesa>Mesa</option></select></div><div class=field id=fMesa><label>Mesa</label><input id=mesa></div><div class=field id=fCidade><label>Cidade</label><select id=cidade></select></div><div class=field><label>Pagamento</label><select id=pagamento><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select></div></div><div id=delivery><div class=actions style="margin:12px 0"><button id=loc class="btn blue">📍 Usar localização</button></div><div id=map class=map></div><p class=muted>Arraste o marcador para ajustar.</p><div class=grid><div class=field><label>Rua</label><input id=rua></div><div class=field><label>Número</label><input id=numero></div><div class=field><label>Bairro</label><input id=bairro></div><div class=field><label>Complemento</label><input id=complemento></div><div class=field><label>Referência</label><input id=referencia></div></div></div><div class=field><label>Observação</label><textarea id=obs></textarea></div></div></main><div class=total><b>Total: R$ <span id=total>0,00</span></b><button id=send class="btn ok">Fazer pedido</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src=/config.js></script><script src=/app.js></script><script>
let card=[],rates=[],cart=new Map(),lat=null,lng=null;const map=L.map('map').setView([-6.4,-48.5],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);const mk=L.marker([-6.4,-48.5],{draggable:true}).addTo(map);mk.on('dragend',()=>{const p=mk.getLatLng();lat=p.lat;lng=p.lng;rev()});
async function load(){const d=await rpc('public_bootstrap');card=d.cardapio||[];rates=d.taxas||[];cidade.innerHTML=rates.filter(x=>x.ativo).map(x=>`<option value="${x.codigo}">${esc(x.nome)} — ${x.gratis?'GRÁTIS':'R$ '+money(x.valor)}</option>`).join('');render();calc()}
function render(){menu.innerHTML=card.map(c=>`<section class=card><h2 style="color:#fbbf24">${esc(c.nome)}</h2>${(c.itens||[]).map(i=>{const q=cart.get(String(i.id))?.q||0;return `<div class=item><div class=row><b>${esc(i.nome)}</b><b>R$ ${money(i.preco)}</b></div><div class=muted>${esc(i.descricao||'')}</div><div class=row><input data-o="${i.id}" placeholder="Observação do item" style="flex:1;padding:8px"><div class=qty><button data-id="${i.id}" data-d=-1>−</button><span id="q${i.id}">${q}</span><button data-id="${i.id}" data-d=1>+</button></div></div></div>`}).join('')}</section>`).join('')}
function calc(){let s=0;cart.forEach((v,id)=>{const p=card.flatMap(c=>c.itens||[]).find(x=>String(x.id)===id);if(p)s+=p.preco*v.q});const r=rates.find(x=>x.codigo===cidade.value),t=tipo.value==='delivery'&&r?(r.gratis?0:+r.valor):0;total.textContent=money(s+t)}
menu.onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const id=b.dataset.id,v=cart.get(id)||{q:0,o:''};v.q=Math.max(0,v.q+Number(b.dataset.d));cart.set(id,v);$('q'+id).textContent=v.q;calc()};menu.oninput=e=>{const i=e.target.closest('[data-o]');if(!i)return;const v=cart.get(i.dataset.o)||{q:0,o:''};v.o=i.value;cart.set(i.dataset.o,v)};
tipo.onchange=()=>{delivery.classList.toggle('hidden',tipo.value!=='delivery');fCidade.classList.toggle('hidden',tipo.value!=='delivery');fMesa.classList.toggle('hidden',tipo.value!=='mesa');calc()};cidade.onchange=calc;
async function rev(){try{const d=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`)).json(),a=d.address||{};rua.value=a.road||'';bairro.value=a.suburb||a.neighbourhood||''}catch{}}
loc.onclick=()=>navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;mk.setLatLng([lat,lng]);map.setView([lat,lng],17);rev()},e=>show(e.message),{enableHighAccuracy:true});
send.onclick=async()=>{try{const itens=[];cart.forEach((v,id)=>{if(v.q>0)itens.push({id,quantidade:v.q,observacao:v.o})});if(!itens.length)throw Error('Selecione itens');const d=await rpc('public_create_order',{p_dados:{cliente:cliente.value,telefone:telefone.value,tipo:tipo.value,cidade:cidade.value,mesa:mesa.value,rua:rua.value,numero:numero.value,bairro:bairro.value,complemento:complemento.value,referencia:referencia.value,latitude:lat,longitude:lng,pagamento:pagamento.value,observacao:obs.value,itens}});location.href='/acompanhar.html?token='+d.token}catch(e){show(e.message)}};const m=new URLSearchParams(location.search).get('mesa');if(m){tipo.value='mesa';mesa.value=m;mesa.readOnly=true}tipo.onchange();load();
</script></body></html>
