<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tá Online</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body>
<div class="topo"><div><b style="font-size:28px;color:#fb923c">TÁ ONLINE</b><div>Hamburgueria • Faça seu pedido</div></div><a class="btn btn-gray" href="/login.html">Equipe</a></div>
<div id="menu" class="grid"></div>
<div class="caixa"><h2>Dados do pedido</h2><div class="grid">
<div class="campo"><label>Nome</label><input id="cliente"></div><div class="campo"><label>Telefone</label><input id="telefone"></div>
<div class="campo"><label>Tipo</label><select id="tipo"><option value="delivery">Delivery</option><option value="retirada">Retirada</option><option value="mesa">Mesa</option></select></div>
<div class="campo" id="campoMesa"><label>Mesa</label><input id="mesa"></div><div class="campo" id="campoCidade"><label>Cidade</label><select id="cidade"></select></div>
<div class="campo"><label>Pagamento</label><select id="pagamento"><option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option></select></div></div>
<div id="deliveryBox"><div class="acoes" style="margin:14px 0"><button id="localizar" class="btn btn-blue">📍 Usar minha localização</button></div><div id="mapa" class="map"></div><p class="muted">Arraste o marcador para ajustar o ponto exato.</p>
<div class="grid"><div class="campo"><label>Rua</label><input id="rua"></div><div class="campo"><label>Número</label><input id="numero"></div><div class="campo"><label>Bairro</label><input id="bairro"></div><div class="campo"><label>Complemento</label><input id="complemento"></div><div class="campo"><label>Referência</label><input id="referencia"></div></div></div>
<div class="campo" style="margin-top:12px"><label>Observação geral</label><textarea id="observacao"></textarea></div>
<div class="row" style="margin-top:16px"><b style="font-size:24px">Total: R$ <span id="total">0,00</span></b><button id="enviar" class="btn btn-ok">Fazer pedido</button></div><div id="msg" class="msg hidden"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/supabase-config.js"></script><script src="/app.js"></script><script>
let cats=[],products=[],cart=new Map(),rates=[],lat=null,lng=null;
const mapa=L.map("mapa").setView([-6.4,-48.5],13);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(mapa);const marker=L.marker([-6.4,-48.5],{draggable:true}).addTo(mapa);
marker.on("dragend",()=>{const p=marker.getLatLng();lat=p.lat;lng=p.lng;reverse()});
async function load(){cats=await must(sb.from("categorias").select("*").eq("ativa",true).order("ordem"));products=await must(sb.from("produtos").select("*").eq("ativo",true).order("nome"));rates=await must(sb.from("taxas_entrega").select("*").eq("ativo",true).order("ordem"));cidade.innerHTML=rates.map(r=>`<option value="${r.id}">${esc(r.nome)} — ${r.gratis?"GRÁTIS":"R$ "+money(r.valor)}</option>`).join("");render();calc()}
function render(){menu.innerHTML=cats.map(c=>{const ps=products.filter(p=>p.categoria_id===c.id);if(!ps.length)return"";return `<section class="caixa"><h2 style="color:#fbbf24">${esc(c.nome)}</h2>${ps.map(p=>{const q=cart.get(p.id)?.q||0;return `<div class="item"><div class="row"><div><b>${esc(p.nome)}</b><div class="muted">${esc(p.descricao||"")}</div></div><b>R$ ${money(p.preco)}</b></div><div class="row"><input data-obs="${p.id}" placeholder="Observação do item" value="${esc(cart.get(p.id)?.obs||"")}" style="flex:1"><div class="acoes"><button class="btn btn-gold" data-id="${p.id}" data-d="-1">−</button><span id="q${p.id}">${q}</span><button class="btn btn-gold" data-id="${p.id}" data-d="1">+</button></div></div></div>`}).join("")}</section>`}).join("")}
menu.onclick=e=>{const b=e.target.closest("[data-id]");if(!b)return;const id=Number(b.dataset.id),v=cart.get(id)||{q:0,obs:""};v.q=Math.max(0,v.q+Number(b.dataset.d));cart.set(id,v);$("q"+id).textContent=v.q;calc()};
menu.oninput=e=>{const i=e.target.closest("[data-obs]");if(!i)return;const id=Number(i.dataset.obs),v=cart.get(id)||{q:0,obs:""};v.obs=i.value;cart.set(id,v)};
function calc(){let sub=0;cart.forEach((v,id)=>{const p=products.find(x=>x.id===id);if(p)sub+=Number(p.preco)*v.q});const r=rates.find(x=>x.id===Number(cidade.value));const taxa=tipo.value==="delivery"&&r?(r.gratis?0:Number(r.valor)):0;total.textContent=money(sub+taxa)}
tipo.onchange=()=>{deliveryBox.classList.toggle("hidden",tipo.value!=="delivery");campoCidade.classList.toggle("hidden",tipo.value!=="delivery");campoMesa.classList.toggle("hidden",tipo.value!=="mesa");calc()};cidade.onchange=calc;
async function reverse(){try{const d=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=pt-BR`)).json(),a=d.address||{};rua.value=a.road||a.pedestrian||"";bairro.value=a.suburb||a.neighbourhood||""}catch{}}
localizar.onclick=()=>navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;marker.setLatLng([lat,lng]);mapa.setView([lat,lng],17);reverse()},e=>{msg.textContent=e.message;msg.classList.remove("hidden")},{enableHighAccuracy:true});
enviar.onclick=async()=>{try{const itens=[];let sub=0;cart.forEach((v,id)=>{if(v.q>0){const p=products.find(x=>x.id===id);itens.push({produto_id:id,nome:p.nome,preco:p.preco,quantidade:v.q,observacao:v.obs,categoria:p.categoria_id});sub+=Number(p.preco)*v.q}});if(!itens.length)throw Error("Selecione pelo menos um item.");const r=rates.find(x=>x.id===Number(cidade.value)),taxa=tipo.value==="delivery"&&r?(r.gratis?0:Number(r.valor)):0;const token=crypto.randomUUID();const pedido={numero:String(Date.now()).slice(-6),cliente:cliente.value,telefone:telefone.value,tipo_pedido:tipo.value,mesa:mesa.value,cidade_id:r?.id||null,cidade_nome:r?.nome||null,endereco:[rua.value,numero.value,bairro.value,complemento.value,referencia.value].filter(Boolean).join(", "),latitude:lat,longitude:lng,observacao:observacao.value,forma_pagamento:pagamento.value,subtotal:sub,taxa_entrega:taxa,total:sub+taxa,status:"aguardando",tracking_token:token};const p=await must(sb.from("pedidos").insert(pedido).select().single());await must(sb.from("pedido_itens").insert(itens.map(i=>({...i,pedido_id:p.id}))));location.href="/acompanhar.html?token="+token}catch(e){msg.textContent=e.message;msg.classList.remove("hidden")}};
const m=new URLSearchParams(location.search).get("mesa");if(m){tipo.value="mesa";mesa.value=m;mesa.readOnly=true}tipo.onchange();load();
</script></body></html>
