<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><link rel=stylesheet href=/styles.css><title>Login</title></head><body><main class=wrap style="max-width:450px"><div class=card><h1 class=brand>Tá Online</h1><h2>Login da equipe</h2><div id=msg class="msg hidden"></div><div class=field><label>Usuário</label><input id=u></div><div class=field><label>Senha</label><input id=p type=password></div><button id=go class="btn ok" style="width:100%;margin-top:12px">Entrar</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src=/config.js></script><script src=/app.js></script><script>go.onclick=async()=>{try{const d=await rpc('app_login',{p_usuario:u.value,p_senha:p.value}),s=Array.isArray(d)?d[0]:d;if(!s)throw Error('Login inválido');localStorage.setItem('ta_session',JSON.stringify(s));location.href={admin:'/painel.html',painel:'/painel.html',producao:'/producao.html',garcom:'/garcom.html',entregador:'/entregador.html'}[s.role]}catch(e){show(e.message)}}</script></body></html>
