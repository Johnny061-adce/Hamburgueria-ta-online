<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/styles.css"></head><body>
<main style="max-width:450px;margin:60px auto"><div class="caixa"><h1 style="color:#fb923c">Tá Online</h1><h2>Login da equipe</h2><div id="erro" class="msg hidden" style="background:#7f1d1d"></div>
<div class="campo"><label>Usuário</label><input id="usuario"></div><div class="campo" style="margin-top:10px"><label>Senha</label><input id="senha" type="password"></div>
<button id="entrar" class="btn btn-ok" style="width:100%;margin-top:15px">Entrar</button></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/app.js"></script><script>
entrar.onclick=async()=>{try{const rows=await must(sb.from("usuarios").select("id,usuario,tipo,ativo").eq("usuario",usuario.value.trim()).eq("senha",senha.value).eq("ativo",true).limit(1));if(!rows.length)throw Error("Usuário ou senha inválidos.");const u=rows[0];localStorage.setItem("sessaoSistemaPedido",JSON.stringify({id:u.id,usuario:u.usuario,setor:u.tipo}));location.href={painel:"/painel.html",admin:"/painel.html",garcom:"/garcom.html",producao:"/producao.html",entregador:"/entregador.html"}[u.tipo]||"/login.html"}catch(e){erro.textContent=e.message;erro.classList.remove("hidden")}};
</script></body></html>
