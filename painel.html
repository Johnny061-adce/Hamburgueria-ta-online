<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="topo"><div class="acoes"><a class="btn btn-blue" href="/producao.html">Produção</a><a class="btn btn-blue" href="/entregador.html">Entregador</a></div><button class="btn btn-red" onclick="logout()">Sair</button></div><h1>Painel</h1>
<div class="abas"><button class="aba-btn ativa" data-a="andamento">Andamento</button><button class="aba-btn" data-a="finalizados">Finalizados</button><button class="aba-btn" data-a="cancelados">Cancelados</button><button class="aba-btn" data-a="caixa">Fechamento</button><button class="aba-btn" data-a="relatorio">Categorias</button><button class="aba-btn" data-a="mais">Mais vendidos</button><button class="aba-btn" data-a="cadastro">Cadastro</button><button class="aba-btn" data-a="usuarios">Usuários</button><button class="aba-btn" data-a="mesas">Mesas</button><button class="aba-btn" data-a="taxas">Taxas</button><button class="aba-btn" data-a="corridas">Corridas</button><button class="aba-btn" data-a="backup">Backup</button></div>
<div id="aba-andamento" class="aba ativa"><div id="andamento"></div></div><div id="aba-finalizados" class="aba"><div id="finalizados"></div></div><div id="aba-cancelados" class="aba"><div id="cancelados"></div></div>
<div id="aba-caixa" class="aba"><div class="caixa"><div class="linha"><input id="cxIni" type="date"><input id="cxFim" type="date"><button id="cxBuscar" class="btn btn-gold">Pesquisar</button></div><div id="cxResumo" class="resumo"></div></div></div>
<div id="aba-relatorio" class="aba"><div class="caixa"><div class="linha"><input id="catIni" type="date"><input id="catFim" type="date"><button id="catBuscar" class="btn btn-gold">Pesquisar</button></div><div id="catResumo"></div></div></div>
<div id="aba-mais" class="aba"><div class="caixa"><div class="linha"><input id="mvIni" type="date"><input id="mvFim" type="date"><button id="mvBuscar" class="btn btn-gold">Pesquisar</button></div><div id="mvResumo"></div></div></div>
<div id="aba-cadastro" class="aba"><div class="caixa"><h2>Cadastrar produto</h2><div class="grid"><div class="campo"><label>Categoria</label><select id="pCat"></select></div><div class="campo"><label>Nova categoria</label><input id="pNovaCat"></div><div class="campo"><label>Nome</label><input id="pNome"></div><div class="campo"><label>Preço</label><input id="pPreco" type="number" step=".01"></div><div class="campo"><label>Descrição</label><textarea id="pDesc"></textarea></div></div><button id="pSalvar" class="btn btn-ok">Cadastrar</button><div id="produtos"></div></div></div>
<div id="aba-usuarios" class="aba"><div class="caixa"><div class="grid"><div class="campo"><label>Usuário</label><input id="uNome"></div><div class="campo"><label>Senha</label><input id="uSenha"></div><div class="campo"><label>Tipo</label><select id="uTipo"><option>painel</option><option>garcom</option><option>producao</option><option>entregador</option></select></div></div><button id="uSalvar" class="btn btn-ok">Cadastrar</button><div id="usuarios"></div></div></div>
<div id="aba-mesas" class="aba"><div class="caixa"><div class="grid"><div class="campo"><label>Número</label><input id="mNumero" type="number"></div><div class="campo"><label>Nome</label><input id="mNome"></div></div><button id="mSalvar" class="btn btn-ok">Cadastrar</button><div id="mesas"></div></div></div>
<div id="aba-taxas" class="aba"><div class="caixa"><div id="taxas"></div><button id="tSalvar" class="btn btn-ok">Salvar taxas</button></div></div>
<div id="aba-corridas" class="aba"><div class="caixa"><div class="linha"><input id="coIni" type="date"><input id="coFim" type="date"><button id="coBuscar" class="btn btn-gold">Pesquisar</button></div><div id="corridas"></div></div></div>
<div id="aba-backup" class="aba"><div class="caixa"><button id="backup" class="btn btn-gold">Baixar backup JSON</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/app.js"></script><script>
const S=requireRole("painel","admin");let pedidos=[],itens=[],cats=[],prods=[],rates=[];
document.querySelectorAll(".aba-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".aba,.aba-btn").forEach(x=>x.classList.remove("ativa"));$("aba-"+b.dataset.a).classList.add("ativa");b.classList.add("ativa")});
async function load(){pedidos=await must(sb.from("pedidos").select("*").order("criado_em",{ascending:false}));itens=await must(sb.from("pedido_itens").select("*"));cats=await must(sb.from("categorias").select("*").order("ordem"));prods=await must(sb.from("produtos").select("*").order("nome"));rates=await must(sb.from("taxas_entrega").select("*").order("ordem"));renderPedidos();renderCad();renderUsers();renderMesas();renderTaxas()}
function card(p){const its=itens.filter(i=>i.pedido_id===p.id);return `<div class="pedido ${p.status==="Finalizado"?"finalizado":p.status==="Cancelado"?"cancelado":""}"><div class="pedido-numero">Pedido #${p.numero}</div><p><b>Status:</b> ${statusLabel(p.status)}</p><p><b>Cliente:</b> ${esc(p.cliente||"-")} • <b>Tipo:</b> ${esc(p.tipo_pedido)}</p><p><b>Endereço:</b> ${esc(p.endereco||"-")}</p>${its.map(i=>`<div class="item">${i.quantidade}x ${esc(i.nome)} ${i.observacao?"• Obs: "+esc(i.observacao):""}</div>`).join("")}<p><b>Total:</b> R$ ${money(p.total)}</p><div class="acoes">${!["Finalizado","Cancelado"].includes(p.status)?`<button class="btn btn-blue" data-st="aceito" data-id="${p.id}">Aceitar</button><button class="btn btn-ok" data-fin="${p.id}">Finalizar</button><button class="btn btn-red" data-st="Cancelado" data-id="${p.id}">Cancelar</button>`:""}<button class="btn btn-gold" onclick='printOrder(${JSON.stringify(p)})'>Imprimir</button></div></div>`}
function renderPedidos(){andamento.innerHTML=pedidos.filter(p=>!["Finalizado","Cancelado"].includes(p.status)).map(card).join("");finalizados.innerHTML=pedidos.filter(p=>p.status==="Finalizado").map(card).join("");cancelados.innerHTML=pedidos.filter(p=>p.status==="Cancelado").map(card).join("")}
document.body.onclick=async e=>{const b=e.target.closest("[data-st],[data-fin]");if(!b)return;if(b.dataset.st){await must(sb.from("pedidos").update({status:b.dataset.st}).eq("id",b.dataset.id))}else{const p=pedidos.find(x=>x.id===b.dataset.fin);const din=Number((prompt("Dinheiro:","0")||"0").replace(",",".")),pix=Number((prompt("Pix:","0")||"0").replace(",",".")),deb=Number((prompt("Débito:","0")||"0").replace(",",".")),cre=Number((prompt("Crédito:","0")||"0").replace(",","."));if(Math.abs(din+pix+deb+cre-Number(p.total))>.01)return alert("A soma não confere.");await must(sb.from("pedidos").update({status:"Finalizado",pag_dinheiro:din,pag_pix:pix,pag_debito:deb,pag_credito:cre,finalizado_em:new Date().toISOString()}).eq("id",p.id))}load()};
function printOrder(p){const w=open("","_blank");w.document.write(`<pre style="font:16px monospace">TÁ ONLINE\nPedido #${p.numero}\nCliente: ${esc(p.cliente||"-")}\n${itens.filter(i=>i.pedido_id===p.id).map(i=>`${i.quantidade}x ${esc(i.nome)}${i.observacao?"\nOBS: "+esc(i.observacao):""}`).join("\n")}\nTOTAL R$ ${money(p.total)}</pre>`);w.document.close();setTimeout(()=>w.print(),300)}
cxBuscar.onclick=()=>summary(cxIni.value,cxFim.value);function filtered(a,b){return pedidos.filter(p=>(!a||p.criado_em.slice(0,10)>=a)&&(!b||p.criado_em.slice(0,10)<=b))}
function summary(a,b){const f=filtered(a,b),ok=f.filter(p=>p.status==="Finalizado");cxResumo.innerHTML=`<div>Total pedidos<br><b>${f.length}</b></div><div>Finalizados<br><b>${ok.length}</b></div><div>Vendido<br><b>R$ ${money(ok.reduce((s,p)=>s+Number(p.total),0))}</b></div><div>Pix<br><b>R$ ${money(ok.reduce((s,p)=>s+Number(p.pag_pix||0),0))}</b></div><div>Dinheiro<br><b>R$ ${money(ok.reduce((s,p)=>s+Number(p.pag_dinheiro||0),0))}</b></div>`}
catBuscar.onclick=()=>{const f=filtered(catIni.value,catFim.value),m={};itens.filter(i=>f.some(p=>p.id===i.pedido_id&&p.status==="Finalizado")).forEach(i=>m[i.categoria_nome]=(m[i.categoria_nome]||0)+Number(i.preco)*i.quantidade);catResumo.innerHTML=Object.entries(m).map(([k,v])=>`<div class="item">${esc(k)}: R$ ${money(v)}</div>`).join("")}
mvBuscar.onclick=()=>{const f=filtered(mvIni.value,mvFim.value),m={};itens.filter(i=>f.some(p=>p.id===i.pedido_id&&p.status==="Finalizado")).forEach(i=>m[i.nome]=(m[i.nome]||0)+i.quantidade);mvResumo.innerHTML=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`<div class="item">${i+1}º ${esc(k)} — ${v}</div>`).join("")}
function renderCad(){pCat.innerHTML='<option value="">Selecione</option>'+cats.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("");produtos.innerHTML=prods.map(p=>`<div class="item">${esc(p.nome)} — R$ ${money(p.preco)} <button class="btn btn-red" onclick="delProd(${p.id})">Excluir</button></div>`).join("")}
pSalvar.onclick=async()=>{let cid=Number(pCat.value);if(pNovaCat.value.trim()){const c=await must(sb.from("categorias").insert({nome:pNovaCat.value.trim(),ordem:cats.length+1}).select().single());cid=c.id}await must(sb.from("produtos").insert({categoria_id:cid,nome:pNome.value,descricao:pDesc.value,preco:Number(pPreco.value)}));load()};window.delProd=async id=>{await must(sb.from("produtos").delete().eq("id",id));load()}
async function renderUsers(){const us=await must(sb.from("usuarios").select("*").order("usuario"));usuarios.innerHTML=us.map(u=>`<div class="item">${esc(u.usuario)} — ${esc(u.tipo)} <button class="btn btn-red" onclick="delUser(${u.id})">Excluir</button></div>`).join("")}
uSalvar.onclick=async()=>{await must(sb.from("usuarios").insert({usuario:uNome.value,senha:uSenha.value,tipo:uTipo.value,ativo:true}));load()};window.delUser=async id=>{await must(sb.from("usuarios").delete().eq("id",id));load()}
async function renderMesas(){const ms=await must(sb.from("mesas").select("*").order("numero"));mesas.innerHTML=ms.map(m=>`<div class="item">Mesa ${m.numero} — ${esc(m.nome||"")} — <span class="muted">${location.origin}/?mesa=${m.numero}</span></div>`).join("")}
mSalvar.onclick=async()=>{await must(sb.from("mesas").insert({numero:Number(mNumero.value),nome:mNome.value,ativa:true}));load()}
function renderTaxas(){taxas.innerHTML=rates.map((r,i)=>`<div class="caixa"><b>${esc(r.nome)}</b><div class="grid"><input data-tv="${i}" type="number" step=".01" value="${r.valor}"><label><input data-tg="${i}" type="checkbox" ${r.gratis?"checked":""}> Grátis</label></div></div>`).join("")}
taxas.oninput=e=>{if(e.target.dataset.tv!=null)rates[+e.target.dataset.tv].valor=Number(e.target.value);if(e.target.dataset.tg!=null)rates[+e.target.dataset.tg].gratis=e.target.checked};tSalvar.onclick=async()=>{for(const r of rates)await must(sb.from("taxas_entrega").update({valor:r.valor,gratis:r.gratis}).eq("id",r.id));alert("Salvo")}
coBuscar.onclick=async()=>{let q=sb.from("historico_corridas").select("*").order("finalizado_em",{ascending:false});if(coIni.value)q=q.gte("finalizado_em",coIni.value);if(coFim.value)q=q.lte("finalizado_em",coFim.value+"T23:59:59");const d=await must(q);corridas.innerHTML=`<p><b>Total: R$ ${money(d.reduce((s,x)=>s+Number(x.taxa),0))}</b></p>`+d.map(x=>`<div class="item">${new Date(x.finalizado_em).toLocaleString("pt-BR")} • ${esc(x.entregador_nome)} • #${x.numero_pedido} • R$ ${money(x.taxa)}</div>`).join("")}
backup.onclick=async()=>{const data={usuarios:await must(sb.from("usuarios").select("*")),categorias:cats,produtos:prods,mesas:await must(sb.from("mesas").select("*")),taxas:rates,pedidos,itens};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="backup-ta-online.json";a.click()}
sb.channel("painel").on("postgres_changes",{event:"*",schema:"public",table:"pedidos"},load).subscribe();load();
</script></body></html>
