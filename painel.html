<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><link rel=stylesheet href=/styles.css><title>Painel</title></head><body><header class=top><div class=brand>Painel / Caixa</div><div class=actions><a class="btn blue" href=/producao.html>Produção</a><a class="btn blue" href=/entregador.html>Entregador</a><button class="btn red" onclick=logout()>Sair</button></div></header><main class=wrap><div id=msg class="msg hidden"></div><section class=card><h2>Taxas de entrega</h2><div id=rates class=grid></div><button id=save class="btn ok">Salvar</button></section><section class=card><h2>Pedidos</h2><div id=orders></div></section><section class=card><h2>Histórico de corridas</h2><div class=actions><input id=ini type=date><input id=fim type=date><button id=filter class="btn orange">Pesquisar</button></div><div id=hist></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src=/config.js></script><script src=/app.js></script><script>
const S=role('admin','painel');let os=[],rs=[];async function load(){const d=await rpc('staff_dashboard',{p_token:S.token});os=d.pedidos||[];rs=d.taxas||[];rates.innerHTML=rs.map((r,i)=>`<div class=card><b>${esc(r.nome)}</b><div class=field><label>Valor</label><input data-v="${i}" type=number step=.01 value="${r.valor}"></div><label><input data-g="${i}" type=checkbox ${r.gratis?'checked':''}> Entrega grátis</label><br><label><input data-a="${i}" type=checkbox ${r.ativo?'checked':''}> Ativa</label></div>`).join('');render()}
rates.oninput=e=>{if(e.target.dataset.v!=null)rs[+e.target.dataset.v].valor=+e.target.value;if(e.target.dataset.g!=null)rs[+e.target.dataset.g].gratis=e.target.checked;if(e.target.dataset.a!=null)rs[+e.target.dataset.a].ativo=e.target.checked};save.onclick=async()=>{await rpc('staff_save_rates',{p_token:S.token,p_taxas:rs});show('Taxas salvas')};
function render(){orders.innerHTML=os.map(o=>`<article class="card pedido"><div class=row><b>Pedido #${o.numero}</b><span class=status>${label(o.status)}</span></div><p>${esc(o.cliente||'-')} • ${esc(o.tipo)} • R$ ${money(o.total)}</p><div class=actions>${o.status==='aguardando'?`<button class="btn ok" data-s=aceito data-id="${o.id}">Aceitar e imprimir</button>`:''}${!['entregue','cancelado'].includes(o.status)?`<button class="btn red" data-s=cancelado data-id="${o.id}">Cancelar</button>`:''}</div></article>`).join('')}
orders.onclick=async e=>{const b=e.target.closest('[data-s]');if(!b)return;await rpc('staff_set_order_status',{p_token:S.token,p_id:b.dataset.id,p_status:b.dataset.s});if(b.dataset.s==='aceito'){const o=os.find(x=>x.id===b.dataset.id),w=open('','_blank');w.document.write(`<pre style="font:16px monospace">TÁ ONLINE\nPedido #${o.numero}\n${(o.itens||[]).map(i=>`${i.quantidade}x ${i.nome}`).join('\n')}\nTOTAL R$ ${money(o.total)}</pre>`);w.document.close();setTimeout(()=>w.print(),300)}load()};
filter.onclick=async()=>{const d=await rpc('staff_delivery_history',{p_token:S.token,p_inicio:ini.value||null,p_fim:fim.value||null});hist.innerHTML=`<p><b>Total R$ ${money(d.total)}</b></p>`+(d.corridas||[]).map(x=>`<div class=item>${x.data} • ${esc(x.entregador)} • #${x.numero} • R$ ${money(x.taxa)}</div>`).join('')};sb.channel('p').on('postgres_changes',{event:'*',schema:'public',table:'pedidos_app'},load).subscribe();load();
</script></body></html>
