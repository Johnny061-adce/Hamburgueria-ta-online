<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><link rel=stylesheet href=/styles.css><title>Produção</title></head><body><div class=topo><h2>Produção</h2><button class="btn btn-red" onclick=logout()>Sair</button></div><div id=lista></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src=/supabase-config.js></script><script src=/app.js></script><script>requireRole("producao","painel","admin");async function load(){const ps=await must(sb.from("pedidos").select("*").in("status",["aceito","producao","pronto"]).order("criado_em"));const its=await must(sb.from("pedido_itens").select("*"));lista.innerHTML=ps.map(p=>`<div class="pedido"><div class=pedido-numero>#${p.numero}</div>${its.filter(i=>i.pedido_id===p.id).map(i=>`<div class=item><b>${i.quantidade}x ${esc(i.nome)}</b>${i.observacao?`<div>OBS: ${esc(i.observacao)}</div>`:""}</div>`).join("")}<div class=acoes>${p.status==="aceito"?`<button class="btn btn-gold" data-s=producao data-id="${p.id}">Iniciar</button>`:""}${p.status==="producao"?`<button class="btn btn-ok" data-s=pronto data-id="${p.id}">Pronto</button>`:""}</div></div>`).join("")}lista.onclick=async e=>{const b=e.target.closest("[data-s]");if(!b)return;await must(sb.from("pedidos").update({status:b.dataset.s}).eq("id",b.dataset.id));load()}sb.channel("prod").on("postgres_changes",{event:"*",schema:"public",table:"pedidos"},load).subscribe();load()</script></body></html>
