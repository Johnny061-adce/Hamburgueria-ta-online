<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><link rel=stylesheet href=/styles.css><title>Produção</title></head><body><header class=top><div class=brand>Produção</div><button class="btn red" onclick=logout()>Sair</button></header><main class=wrap><div id=orders></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src=/config.js></script><script src=/app.js></script><script>const S=role('admin','painel','producao');async function load(){const d=await rpc('staff_orders',{p_token:S.token});orders.innerHTML=(d||[]).filter(o=>['aceito','producao','pronto'].includes(o.status)).map(o=>`<div class="card pedido"><div class=row><b>#${o.numero}</b><span class=status>${label(o.status)}</span></div>${(o.itens||[]).map(i=>`<div class=item><b>${i.quantidade}x ${esc(i.nome)}</b>${i.observacao?`<div>OBS: ${esc(i.observacao)}</div>`:''}</div>`).join('')}<div class=actions>${o.status==='aceito'?`<button class="btn orange" data-s=producao data-id="${o.id}">Iniciar produção</button>`:''}${o.status==='producao'?`<button class="btn ok" data-s=pronto data-id="${o.id}">Pronto</button>`:''}</div></div>`).join('')}orders.onclick=async e=>{const b=e.target.closest('[data-s]');if(!b)return;await rpc('staff_set_order_status',{p_token:S.token,p_id:b.dataset.id,p_status:b.dataset.s});load()};sb.channel('prod').on('postgres_changes',{event:'*',schema:'public',table:'pedidos_app'},load).subscribe();load()</script></body></html>
