<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garçom</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#111827;color:#fff}
    h1{text-align:center;margin:0 0 8px;font-size:46px}
    .marca{text-align:center;color:#fb923c;font-size:22px;font-weight:bold;margin-bottom:18px}
    .topo{display:flex;justify-content:flex-end;margin-bottom:10px}
    .btn-sair{border:none;background:#ef4444;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:bold}
    .abas{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
    .aba-btn{border:none;background:#1f2937;color:#fff;padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:bold}
    .aba-btn.ativa{background:#fb923c;color:#111}
    .aba{display:none}
    .aba.ativa{display:block}
    .caixa{background:#1f2937;border-radius:16px;padding:20px}
    .grid-topo{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
    .grid-topo-2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
    .campo{display:flex;flex-direction:column}
    .campo label{margin-bottom:6px;font-weight:bold}
    .campo input,.campo select,.campo textarea{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px}
    .campo textarea{min-height:46px;resize:vertical}
    .grid-cardapio{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}
    .coluna{padding:10px}
    .coluna.direita{border-left:2px solid rgba(255,255,255,.15)}
    .categoria{margin-bottom:24px}
    .categoria-titulo{color:#fbbf24;font-size:28px;font-weight:bold;text-transform:uppercase;border-bottom:2px solid rgba(255,255,255,.15);padding-bottom:8px;margin-bottom:10px}
    .item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);align-items:center}
    .linha-nome-preco{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
    .nome-item{font-weight:bold;text-transform:uppercase}
    .preco-item{color:#fbbf24;font-weight:bold}
    .descricao-item{color:#e5e7eb;font-size:14px}
    .controle-qtd{display:flex;align-items:center;gap:8px}
    .btn-qtd{width:36px;height:36px;border:none;border-radius:50%;background:#fb923c;color:#fff;font-size:22px;font-weight:bold;cursor:pointer}
    .btn-qtd:disabled{opacity:.4}
    .qtd-numero{min-width:24px;text-align:center;font-size:18px;font-weight:bold}
    .obs-item{width:100%;margin-top:8px;border:none;border-radius:8px;padding:8px;font-size:13px}
    .rodape{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}
    .total{font-size:34px;font-weight:bold;color:#fde68a}
    .btn-principal{border:none;color:#fff;padding:14px 20px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;background:#22c55e}
    .btn-secundario{border:none;color:#fff;padding:14px 20px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;background:#6b7280}
    .msg{margin-top:16px;font-weight:bold;color:#86efac}
    .erro{margin-top:16px;font-weight:bold;color:#fca5a5}
    .pedido{background:#1f2937;border-left:6px solid #fb923c;border-radius:12px;padding:16px;margin-bottom:16px}
    .pedido-numero{font-size:24px;font-weight:bold;color:#fbbf24}
    .pedido-info{margin:6px 0}
    .pedido ul{margin-top:8px;padding-left:22px}
    .acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .btn-editar{border:none;background:#3b82f6;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:bold}
    .btn-imprimir{border:none;background:#fbbf24;color:#111;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:bold}
    .badge{display:inline-block;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:bold;color:#111}
    .badge-amarelo{background:#facc15}
    .badge-verde{background:#22c55e}
    .badge-cinza{background:#cbd5e1}
    .vazio{text-align:center;color:#cbd5e1;font-size:22px;padding:50px 20px}
    @media (max-width:900px){
      .grid-topo,.grid-topo-2,.grid-cardapio{grid-template-columns:1fr}
      .coluna.direita{border-left:none}
      .rodape{flex-direction:column;align-items:stretch}
    }
  </style>
</head>
<body>
  <div class="topo">
    <button class="btn-sair" id="btnSair">Sair</button>
  </div>

  <h1>Garçom</h1>
  <div class="marca">TÁ ONLINE HAMBURGUERIA</div>

  <div class="abas">
    <button class="aba-btn ativa" data-aba="novo">Novo Pedido</button>
    <button class="aba-btn" data-aba="pedidos">Pedidos</button>
  </div>

  <div id="aba-novo" class="aba ativa">
    <div class="caixa">
      <div class="grid-topo">
        <div class="campo">
          <label>Nome do cliente</label>
          <input id="cliente" placeholder="Digite o nome do cliente">
        </div>

        <div class="campo">
          <label>Telefone</label>
          <input id="telefone" placeholder="Ex: 63991080732">
        </div>

        <div class="campo">
          <label>Tipo do pedido</label>
          <select id="tipoPedido">
            <option value="mesa">Mesa</option>
            <option value="delivery">Delivery</option>
            <option value="retirada">Retirada</option>
          </select>
        </div>
      </div>

      <div class="grid-topo-2">
        <div class="campo">
          <label>Número da mesa</label>
          <input id="mesa" placeholder="Ex: 3">
        </div>

        <div class="campo">
          <label>Taxa de delivery</label>
          <input id="taxaEntrega" type="number" step="0.01" value="0">
        </div>

        <div class="campo" style="grid-column: span 2;">
          <label>Endereço de entrega</label>
          <input id="endereco" placeholder="Rua, número, bairro, referência">
        </div>
      </div>

      <div class="campo">
        <label>Observação geral</label>
        <textarea id="observacao" placeholder="Ex: sem cebola, pouco molho"></textarea>
      </div>

      <div id="msgErroCardapio" class="erro"></div>
      <div id="cardapio" class="grid-cardapio"></div>

      <div class="rodape">
        <div class="total">Total: R$ <span id="totalPedido">0,00</span></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn-secundario" id="btnCancelarEdicao" style="display:none">Cancelar Edição</button>
          <button class="btn-principal" id="btnEnviarPedido">Enviar Pedido</button>
        </div>
      </div>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div id="aba-pedidos" class="aba">
    <div id="listaPedidos"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
  <script src="/supabase-adapter.js"></script>
  
  <script>
    const sessao = JSON.parse(localStorage.getItem("sessaoSistemaPedido") || "null");
    if (!sessao || sessao.setor !== "garcom") {
      window.location.href = "/login.html";
    }

    let socket = null;
    let cardapioBase = [];
    let cardapioAtual = [];
    let pedidos = [];
    let pedidoEmEdicaoId = null;

    function tocarAlerta() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.type = "sine";
        o.frequency.value = 880;
        g.gain.value = 0.08;
        o.start();
        setTimeout(() => {
          o.stop();
          ctx.close();
        }, 180);
      } catch (e) {}
    }

    function formatarMoeda(valor) {
      return Number(valor || 0).toFixed(2).replace(".", ",");
    }

    function numero(v) {
      return Number(String(v || 0).replace(",", ".")) || 0;
    }

    function escaparHtml(texto) {
      return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function badgeStatus(status) {
      const s = String(status || "").toLowerCase();
      if (s.includes("pronto")) return '<span class="badge badge-verde">Pronto</span>';
      if (s.includes("andamento") || s.includes("produção")) return '<span class="badge badge-amarelo">Em andamento</span>';
      return '<span class="badge badge-cinza">' + (status || "-") + '</span>';
    }

    function trocarAba(nome) {
      document.querySelectorAll(".aba").forEach(el => el.classList.remove("ativa"));
      document.querySelectorAll(".aba-btn").forEach(el => el.classList.remove("ativa"));

      const aba = document.getElementById("aba-" + nome);
      const btn = document.querySelector('.aba-btn[data-aba="' + nome + '"]');

      if (aba) aba.classList.add("ativa");
      if (btn) btn.classList.add("ativa");

      if (nome === "pedidos") carregarPedidos();
    }

    function limparFormulario() {
      document.getElementById("cliente").value = "";
      document.getElementById("telefone").value = "";
      document.getElementById("tipoPedido").value = "mesa";
      document.getElementById("mesa").value = "";
      document.getElementById("taxaEntrega").value = "0";
      document.getElementById("endereco").value = "";
      document.getElementById("observacao").value = "";
      document.getElementById("msg").textContent = "";
      pedidoEmEdicaoId = null;
      document.getElementById("btnEnviarPedido").textContent = "Enviar Pedido";
      document.getElementById("btnCancelarEdicao").style.display = "none";
      resetarCardapioAtual();
      controlarCamposTipoPedido();
      renderizarCardapio();
    }

    function resetarCardapioAtual() {
      cardapioAtual = cardapioBase.map(function(categoria) {
        return {
          ...categoria,
          itens: (categoria.itens || []).map(function(item) {
            return {
              ...item,
              quantidade: 0,
              observacao: ""
            };
          })
        };
      });
    }

    function controlarCamposTipoPedido() {
      const tipo = document.getElementById("tipoPedido").value;
      const mesa = document.getElementById("mesa");
      const endereco = document.getElementById("endereco");
      const taxaEntrega = document.getElementById("taxaEntrega");

      if (tipo === "mesa") {
        mesa.disabled = false;
        endereco.disabled = true;
        taxaEntrega.disabled = true;
        endereco.value = "";
        taxaEntrega.value = "0";
      } else if (tipo === "delivery") {
        mesa.disabled = true;
        mesa.value = "";
        endereco.disabled = false;
        taxaEntrega.disabled = false;
      } else {
        mesa.disabled = true;
        mesa.value = "";
        endereco.disabled = true;
        endereco.value = "";
        taxaEntrega.disabled = true;
        taxaEntrega.value = "0";
      }

      atualizarTotal();
    }

    function atualizarTotal() {
      let subtotal = 0;
      cardapioAtual.forEach(function(categoria) {
        (categoria.itens || []).forEach(function(item) {
          subtotal += numero(item.preco) * numero(item.quantidade);
        });
      });

      const tipoPedido = document.getElementById("tipoPedido").value;
      const taxa = tipoPedido === "delivery" ? numero(document.getElementById("taxaEntrega").value) : 0;
      document.getElementById("totalPedido").textContent = formatarMoeda(subtotal + taxa);
    }

    function renderizarCardapio() {
      const container = document.getElementById("cardapio");
      const erro = document.getElementById("msgErroCardapio");
      erro.textContent = "";

      if (!Array.isArray(cardapioAtual) || !cardapioAtual.length) {
        container.innerHTML = '<div class="vazio">Nenhum item cadastrado no cardápio.</div>';
        return;
      }

      let esquerda = '<div class="coluna esquerda">';
      let direita = '<div class="coluna direita">';

      cardapioAtual.forEach(function(categoria, i) {
        let bloco = '<div class="categoria"><div class="categoria-titulo">' + categoria.nome + '</div>';

        (categoria.itens || []).forEach(function(item, j) {
          const esgotado = item.esgotado === true;

          bloco +=
            '<div class="item" style="' + (esgotado ? 'opacity:.5;' : '') + '">' +
              '<div>' +
                '<div class="linha-nome-preco">' +
                  '<span class="nome-item">' + item.nome + '</span>' +
                  '<span class="preco-item">R$ ' + formatarMoeda(item.preco) + '</span>' +
                '</div>' +
                '<div class="descricao-item">' + (item.descricao || "") + '</div>' +
                '<input class="obs-item" ' + (esgotado ? 'disabled' : '') + ' data-tipo="obs" data-cat="' + i + '" data-item="' + j + '" placeholder="Observação deste item" value="' + String(item.observacao || "").replace(/"/g, '&quot;') + '">' +
              '</div>' +
              '<div class="controle-qtd">' +
                '<button class="btn-qtd" ' + (esgotado ? 'disabled' : '') + ' data-tipo="menos" data-cat="' + i + '" data-item="' + j + '">-</button>' +
                '<span class="qtd-numero" id="qtd-' + i + '-' + j + '">' + numero(item.quantidade) + '</span>' +
                '<button class="btn-qtd" ' + (esgotado ? 'disabled' : '') + ' data-tipo="mais" data-cat="' + i + '" data-item="' + j + '">+</button>' +
              '</div>' +
            '</div>';
        });

        bloco += '</div>';

        if ((categoria.coluna || "esquerda") === "direita") direita += bloco;
        else esquerda += bloco;
      });

      esquerda += '</div>';
      direita += '</div>';

      container.innerHTML = esquerda + direita;
      atualizarTotal();
    }

    function alterarQuantidade(catIndex, itemIndex, delta) {
      const item = cardapioAtual[catIndex].itens[itemIndex];
      if (item.esgotado) return;
      item.quantidade = numero(item.quantidade) + delta;
      if (item.quantidade < 0) item.quantidade = 0;

      const el = document.getElementById("qtd-" + catIndex + "-" + itemIndex);
      if (el) el.textContent = item.quantidade;

      atualizarTotal();
    }

    async function carregarCardapio() {
      try {
        const r = await fetch("/api/cardapio");
        const dados = await r.json();

        if (!Array.isArray(dados)) {
          throw new Error("Resposta inválida do cardápio.");
        }

        cardapioBase = dados;
        resetarCardapioAtual();
        renderizarCardapio();
      } catch (e) {
        console.error(e);
        document.getElementById("msgErroCardapio").textContent = "Erro ao carregar cardápio.";
        document.getElementById("cardapio").innerHTML = '<div class="vazio">Erro ao carregar cardápio.</div>';
      }
    }

    function coletarItensSelecionados() {
      const itens = [];
      let subtotal = 0;

      cardapioAtual.forEach(function(categoria) {
        (categoria.itens || []).forEach(function(item) {
          if (numero(item.quantidade) > 0) {
            itens.push({
              nome: item.nome,
              preco: numero(item.preco),
              quantidade: numero(item.quantidade),
              observacao: item.observacao || "",
              categoria: categoria.nome
            });
            subtotal += numero(item.preco) * numero(item.quantidade);
          }
        });
      });

      return { itens, subtotal };
    }

    async function enviarOuSalvarPedido() {
      const cliente = document.getElementById("cliente").value.trim();
      const telefone = document.getElementById("telefone").value.trim();
      const tipoPedido = document.getElementById("tipoPedido").value;
      const mesa = document.getElementById("mesa").value.trim();
      const taxaEntrega = tipoPedido === "delivery" ? numero(document.getElementById("taxaEntrega").value) : 0;
      const endereco = document.getElementById("endereco").value.trim();
      const observacao = document.getElementById("observacao").value.trim();
      const msg = document.getElementById("msg");

      const dadosItens = coletarItensSelecionados();
      const itens = dadosItens.itens;
      const subtotal = dadosItens.subtotal;

      if (!itens.length) {
        alert("Selecione pelo menos 1 item.");
        return;
      }

      if (tipoPedido === "mesa" && !mesa) {
        alert("Digite a mesa.");
        return;
      }

      if (tipoPedido === "delivery" && !endereco) {
        alert("Digite o endereço de entrega.");
        return;
      }

      const body = {
        cliente,
        telefone,
        tipoPedido,
        mesa,
        endereco,
        taxaEntrega,
        observacao,
        itens,
        subtotalPedido: subtotal,
        descontoValor: 0,
        totalPedido: subtotal + taxaEntrega,
        garcom: sessao.usuario
      };

      try {
        let r;

        if (pedidoEmEdicaoId) {
          r = await fetch("/api/pedidos/" + pedidoEmEdicaoId + "/editar", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
        } else {
          body.origem = "garcom";
          r = await fetch("/api/pedidos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
        }

        const dados = await r.json();

        if (!dados.sucesso) {
          alert(dados.erro || "Erro ao salvar pedido.");
          return;
        }

        msg.textContent = pedidoEmEdicaoId ? "Pedido editado com sucesso." : "Pedido enviado com sucesso.";
        limparFormulario();
        carregarPedidos();
      } catch (e) {
        console.error(e);
        alert("Erro ao salvar pedido.");
      }
    }

    async function carregarPedidos() {
      try {
        const r = await fetch("/api/pedidos");
        const dados = await r.json();
        pedidos = Array.isArray(dados) ? dados : [];

        const meus = pedidos.filter(function(p) {
          return (p.garcom || "") === sessao.usuario;
        });

        const lista = document.getElementById("listaPedidos");

        if (!meus.length) {
          lista.innerHTML = '<div class="vazio">Nenhum pedido encontrado.</div>';
          return;
        }

        let html = "";

        for (let i = 0; i < meus.length; i++) {
          const p = meus[i];

          let itensHtml = "<ul>";
          const itens = Array.isArray(p.itens) ? p.itens : [];

          for (let j = 0; j < itens.length; j++) {
            const item = itens[j];
            itensHtml += "<li>" +
              item.quantidade + "x " + item.nome +
              (item.observacao ? " | Obs.: " + item.observacao : "") +
              "</li>";
          }
          itensHtml += "</ul>";

          let botoes = "";
          if (p.status !== "Finalizado" && p.status !== "Cancelado") {
            botoes =
              '<div class="acoes">' +
                '<button class="btn-editar" data-editar-pedido="' + p.id + '">Editar</button>' +
                '<button class="btn-imprimir" onclick="imprimirPedidoGarcom(' + p.id + ')">Imprimir</button>' +
              '</div>';
          } else {
            botoes =
              '<div class="acoes">' +
                '<button class="btn-imprimir" onclick="imprimirPedidoGarcom(' + p.id + ')">Imprimir</button>' +
              '</div>';
          }

          html +=
            '<div class="pedido">' +
              '<div class="pedido-numero">Pedido #' + (p.numeroPedido || "-") + '</div>' +
              '<div class="pedido-info"><strong>Status:</strong> ' + badgeStatus(p.statusVisual || p.status) + '</div>' +
              '<div class="pedido-info"><strong>Cliente:</strong> ' + (p.cliente || "-") + '</div>' +
              '<div class="pedido-info"><strong>Tipo:</strong> ' + (p.tipoPedido || "-") + '</div>' +
              '<div class="pedido-info"><strong>Mesa:</strong> ' + (p.mesa || "-") + '</div>' +
              '<div class="pedido-info"><strong>Telefone:</strong> ' + (p.telefone || "-") + '</div>' +
              '<div class="pedido-info"><strong>Total:</strong> R$ ' + formatarMoeda(p.totalPedido || 0) + '</div>' +
              itensHtml +
              botoes +
            '</div>';
        }

        lista.innerHTML = html;
      } catch (e) {
        console.error(e);
        document.getElementById("listaPedidos").innerHTML =
          '<div class="vazio">Erro ao carregar pedidos.</div>';
      }
    }

    function carregarPedidoParaEdicao(id) {
      const pedido = pedidos.find(function(p) {
        return numero(p.id) === numero(id);
      });

      if (!pedido) return;

      resetarCardapioAtual();

      (pedido.itens || []).forEach(function(itemPedido) {
        cardapioAtual.forEach(function(categoria) {
          (categoria.itens || []).forEach(function(item) {
            if (item.nome === itemPedido.nome && numero(item.preco) === numero(itemPedido.preco)) {
              item.quantidade = numero(itemPedido.quantidade);
              item.observacao = itemPedido.observacao || "";
            }
          });
        });
      });

      pedidoEmEdicaoId = id;
      document.getElementById("cliente").value = pedido.cliente || "";
      document.getElementById("telefone").value = pedido.telefone || "";
      document.getElementById("tipoPedido").value = pedido.tipoPedido || "mesa";
      document.getElementById("mesa").value = pedido.mesa || "";
      document.getElementById("taxaEntrega").value = pedido.taxaEntrega || 0;
      document.getElementById("endereco").value = pedido.endereco || "";
      document.getElementById("observacao").value = pedido.observacao || "";

      document.getElementById("btnEnviarPedido").textContent = "Salvar Alterações";
      document.getElementById("btnCancelarEdicao").style.display = "inline-block";

      controlarCamposTipoPedido();
      renderizarCardapio();
      trocarAba("novo");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function imprimirJanelaGarcom(titulo, conteudoHtml) {
      const janela = window.open("", "_blank", "width=380,height=650");

      if (!janela) {
        alert("O navegador bloqueou a janela de impressão.");
        return;
      }

      janela.document.open();
      janela.document.write(`
        <!DOCTYPE html>
        <html lang="pt-BR">
        <head>
          <meta charset="UTF-8">
          <title>${escaparHtml(titulo)}</title>
          <style>
            *{box-sizing:border-box}
            html,body{
              margin:0;
              padding:0;
              width:58mm;
              background:#fff;
              color:#000;
              font-family:monospace;
              overflow:hidden;
            }
            body{
              padding:4px 4px 8px 4px;
              font-size:11px;
            }
            h2{
              text-align:center;
              margin:0 0 2px 0;
              font-size:18px;
              font-weight:bold;
              line-height:1.1;
            }
            .subtitulo{
              text-align:center;
              font-size:14px;

    function imprimirPedidoGarcom(id) {
      const pedido = pedidos.find(function(p) {
        return Number(p.id) === Number(id);
      });

      if (!pedido) {
        alert("Pedido não encontrado.");
        return;
      }

      let itensHTML = "";
      (pedido.itens || []).forEach(function(item) {
        const obsHtml = item.observacao
          ? "<br><small>Obs.: " + escaparHtml(item.observacao) + "</small>"
          : "";

        itensHTML +=
          "<tr>" +
            "<td class='item-nome'>" +
              escaparHtml(item.quantidade + "x " + item.nome) +
              obsHtml +
            "</td>" +
            "<td class='dir'>R$ " + formatarMoeda(Number(item.preco) * Number(item.quantidade)) + "</td>" +
          "</tr>";
      });

      const html =
        "<h2>TÁ ONLINE</h2>" +
        "<div class='subtitulo'>Hamburgueria</div>" +
        "<hr>" +
        "<div class='linha'><b>Pedido:</b> #" + escaparHtml(pedido.numeroPedido || "-") + "</div>" +
        "<div class='linha'><b>Cliente:</b> " + escaparHtml(pedido.cliente || "-") + "</div>" +
        "<div class='linha'><b>Garçom:</b> " + escaparHtml(pedido.garcom || "-") + "</div>" +
        "<div class='linha'><b>Tipo:</b> " + escaparHtml(pedido.tipoPedido || "-") + "</div>" +
        "<div class='linha'><b>Mesa:</b> " + escaparHtml(pedido.mesa || "-") + "</div>" +
        "<div class='linha'><b>Telefone:</b> " + escaparHtml(pedido.telefone || "-") + "</div>" +
        "<div class='linha'><b>Data:</b> " + escaparHtml(pedido.dataHora || "-") + "</div>" +
        "<hr>" +
        "<table>" + itensHTML + "</table>" +
        "<hr>" +
        "<div class='linha'><b>Subtotal:</b> R$ " + formatarMoeda(pedido.subtotalPedido || 0) + "</div>" +
        "<div class='linha'><b>Taxa:</b> R$ " + formatarMoeda(pedido.taxaEntrega || 0) + "</div>" +
        "<div class='linha'><b>Total:</b> R$ " + formatarMoeda(pedido.totalPedido || 0) + "</div>" +
        "<hr>" +
        "<div class='linha'><b>Observação:</b></div>" +
        "<div class='linha'>" + escaparHtml(pedido.observacao || "-") + "</div>" +
        "<hr>" +
        "<div class='total'>TOTAL: R$ " + formatarMoeda(pedido.totalPedido || 0) + "</div>" +
        "<br><br>";

      imprimirJanelaGarcom("Cupom Garçom", html);
    }

    window.imprimirPedidoGarcom = imprimirPedidoGarcom;

    function iniciarSocket() {
      if (!window.io) return;

      try {
        socket = io();
        socket.on("cardapioAtualizado", function() {
          carregarCardapio();
        });
        socket.on("pedidoAtualizado", function() {
          carregarPedidos();
        });
        socket.on("novoPedido", function() {
          tocarAlerta();
          carregarPedidos();
        });
      } catch (e) {
        console.error(e);
      }
    }

    function ligarEventos() {
      document.querySelectorAll(".aba-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          trocarAba(this.getAttribute("data-aba"));
        });
      });

      document.getElementById("tipoPedido").addEventListener("change", controlarCamposTipoPedido);
      document.getElementById("taxaEntrega").addEventListener("input", atualizarTotal);
      document.getElementById("btnEnviarPedido").addEventListener("click", enviarOuSalvarPedido);
      document.getElementById("btnCancelarEdicao").addEventListener("click", limparFormulario);
      document.getElementById("btnSair").addEventListener("click", function() {
        localStorage.removeItem("sessaoSistemaPedido");
        window.location.href = "/login.html";
      });

      document.getElementById("cardapio").addEventListener("click", function(e) {
        const botao = e.target.closest("button[data-tipo]");
        if (!botao) return;

        const tipo = botao.getAttribute("data-tipo");
        const cat = numero(botao.getAttribute("data-cat"));
        const item = numero(botao.getAttribute("data-item"));

        if (tipo === "mais") alterarQuantidade(cat, item, 1);
        if (tipo === "menos") alterarQuantidade(cat, item, -1);
      });

      document.getElementById("cardapio").addEventListener("input", function(e) {
        const input = e.target.closest("input[data-tipo='obs']");
        if (!input) return;

        const cat = numero(input.getAttribute("data-cat"));
        const item = numero(input.getAttribute("data-item"));

        if (cardapioAtual[cat] && cardapioAtual[cat].itens[item]) {
          cardapioAtual[cat].itens[item].observacao = input.value;
        }
      });

      document.getElementById("listaPedidos").addEventListener("click", function(e) {
        const btn = e.target.closest("[data-editar-pedido]");
        if (!btn) return;
        carregarPedidoParaEdicao(btn.getAttribute("data-editar-pedido"));
      });
    }

    async function iniciarPagina() {
  ligarEventos();
  iniciarSocket();
  controlarCamposTipoPedido();
  await carregarCardapio();
  await carregarPedidos();
}

function preencherMesaPelaUrl(){
  const params = new URLSearchParams(window.location.search);
  const mesaUrl = params.get("mesa");

  const campoMesa = document.getElementById("mesa"); 

  if(!campoMesa) return;

  if(mesaUrl){
    campoMesa.value = mesaUrl;
    campoMesa.readOnly = true;
    campoMesa.style.background = "#374151";
    campoMesa.style.cursor = "not-allowed";
  }
}

preencherMesaPelaUrl();



    iniciarPagina();
  </script>
