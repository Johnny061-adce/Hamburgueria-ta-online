<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cliente</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:20px;background:#111827;color:#fff;font-family:Arial,sans-serif}
    .topo{text-align:center;margin-bottom:18px}
    .topo h1{margin:0;font-size:44px}
    .topo .sub{color:#fb923c;font-weight:bold;font-size:20px}
    .dados{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
    .campo{display:flex;flex-direction:column}
    .campo label{font-weight:bold;margin-bottom:6px}
    .campo input,.campo textarea,.campo select{border:none;border-radius:10px;padding:12px;font-size:15px;width:100%}
    .campo textarea{resize:vertical;min-height:46px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .coluna{padding:10px}
    .coluna.direita{border-left:2px solid rgba(255,255,255,.15)}
    .categoria{margin-bottom:24px}
    .categoria-titulo{color:#fbbf24;font-size:28px;font-weight:bold;text-transform:uppercase;border-bottom:2px solid rgba(255,255,255,.15);padding-bottom:8px;margin-bottom:10px}
    .item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);align-items:center}
    .linha-nome-preco{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
    .nome-item{font-weight:bold;text-transform:uppercase}
    .preco-item{color:#fbbf24;font-weight:bold}
    .descricao{color:#e5e7eb;font-size:14px}
    .controle{display:flex;align-items:center;gap:8px}
    .btn-qtd{width:34px;height:34px;border:none;border-radius:50%;background:#fb923c;color:#fff;font-size:22px;font-weight:bold;cursor:pointer}
    .btn-qtd:disabled{opacity:.4;cursor:not-allowed}
    .qtd{min-width:24px;text-align:center;font-size:18px;font-weight:bold}
    .obs-item{width:100%;margin-top:8px;border:none;border-radius:8px;padding:8px;font-size:13px}
    .rodape{margin-top:24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .total{font-size:30px;font-weight:bold;color:#fde68a}
    .botao{background:#22c55e;color:#fff;border:none;border-radius:12px;padding:16px 24px;font-size:20px;font-weight:bold;cursor:pointer}
    .caixa-pagto{background:rgba(255,255,255,.05);border-radius:12px;padding:16px;margin-top:20px}
    .pagamentos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .msg{text-align:center;margin-top:12px;font-weight:bold;color:#86efac}
    .erro{text-align:center;margin-top:12px;font-weight:bold;color:#fca5a5}
    .mesa-fixa{background:#0f172a;color:#fde68a;font-weight:bold}
    @media (max-width:900px){
      .dados,.grid,.pagamentos{grid-template-columns:1fr}
      .coluna.direita{border-left:none}
    }
  </style>
</head>
<body>
  <div class="topo">
    <h1>TÁ ONLINE</h1>
    <div class="sub">Faça seu pedido</div>
  </div>

  <div class="dados">
    <div class="campo"><label>Nome</label><input id="cliente" placeholder="Seu nome"></div>
    <div class="campo"><label>Telefone</label><input id="telefone" placeholder="Ex: 63999999999"></div>
    <div class="campo">
      <label>Tipo do pedido</label>
      <select id="tipoPedido">
        <option value="mesa">Mesa</option>
        <option value="retirada">Retirada</option>
        <option value="delivery">Delivery</option>
      </select>
    </div>
    <div class="campo"><label>Mesa</label><input id="mesa" placeholder="Ex: 3"></div>
    <div class="campo"><label>Observação geral</label><textarea id="observacao" placeholder="Ex: sem cebola"></textarea></div>
  </div>

  <div class="dados" style="grid-template-columns:repeat(2,1fr);">
    <div class="campo"><label>Endereço de entrega</label><input id="endereco" placeholder="Rua, número, bairro, referência"></div>
    <div class="campo"><label>Taxa de delivery</label><input id="taxaEntrega" type="number" step="0.01" value="0"></div>
  </div>

  <div id="mensagemErro" class="erro"></div>

  <div id="cardapio" class="grid"></div>

  <div class="caixa-pagto">
    <div class="campo">
      <label>Como deseja pagar?</label>
      <select id="tipoPagamentoPedido">
        <option value="mesa">Pagar depois</option>
        <option value="agora">Pagar agora</option>
      </select>
    </div>

    <div id="blocoPagamentoAgora" style="display:none;">
      <div style="margin-top:12px;font-weight:bold;">Informe os valores do pagamento</div>
      <div class="pagamentos">
        <div class="campo"><label>Dinheiro</label><input type="number" step="0.01" id="pagDinheiro" placeholder="0,00"></div>
        <div class="campo"><label>Pix</label><input type="number" step="0.01" id="pagPix" placeholder="0,00"></div>
        <div class="campo"><label>Cartão Débito</label><input type="number" step="0.01" id="pagDebito" placeholder="0,00"></div>
        <div class="campo"><label>Cartão Crédito</label><input type="number" step="0.01" id="pagCredito" placeholder="0,00"></div>
      </div>
      <div style="margin-top:12px;font-weight:bold;">Soma do pagamento: R$ <span id="somaPagamentos">0,00</span></div>
    </div>
  </div>

  <div class="rodape">
    <div class="total">Total: R$ <span id="total">0,00</span></div>
    <button id="btnPedido" class="botao">Fazer Pedido</button>
  </div>

  <div id="mensagem" class="msg"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
  <script src="/supabase-adapter.js"></script>
  
  <script>
    const socket = io();
    let categorias = [];
    const params = new URLSearchParams(window.location.search);
    const mesaDaURL = (params.get("mesa") || "").trim();

    function formatarMoeda(v){ return Number(v || 0).toFixed(2).replace(".", ","); }
    function valorNumero(id){ return Number(String(document.getElementById(id).value || "0").replace(",", ".")) || 0; }

    async function carregarCardapio(){
      try{
        const r = await fetch("/api/cardapio");
        const dados = await r.json();

        if(!Array.isArray(dados)){
          throw new Error("Cardápio inválido.");
        }

        categorias = dados.map(cat => ({
          ...cat,
          itens: (cat.itens || []).map(item => ({
            ...item,
            quantidade: typeof item.quantidade === "undefined" ? 0 : item.quantidade,
            observacao: typeof item.observacao === "undefined" ? "" : item.observacao
          }))
        }));

        renderizar();
      }catch(e){
        console.error(e);
        document.getElementById("mensagemErro").textContent = "Erro ao carregar o cardápio.";
        document.getElementById("cardapio").innerHTML = '<div class="erro">Erro ao carregar o cardápio.</div>';
      }
    }

    function renderizar(){
      const alvo = document.getElementById("cardapio");
      const esq = document.createElement("div");
      esq.className = "coluna esquerda";
      const dir = document.createElement("div");
      dir.className = "coluna direita";

      for(let i=0;i<categorias.length;i++){
        const cat = categorias[i];
        const bloco = document.createElement("div");
        bloco.className = "categoria";

        let html = '<div class="categoria-titulo">'+cat.nome+'</div>';

        for(let j=0;j<cat.itens.length;j++){
          const item = cat.itens[j];
          const esgotado = item.esgotado === true;
          const estoqueTxt = item.controlarEstoque ? ('<div class="descricao">Estoque: '+(item.estoque || 0)+'</div>') : '';

          html +=
            '<div class="item" style="'+(esgotado?'opacity:.5;':'')+'">'+
              '<div>'+
                '<div class="linha-nome-preco"><span class="nome-item">'+item.nome+'</span><span class="preco-item">R$ '+formatarMoeda(item.preco)+'</span></div>'+
                '<div class="descricao">'+(item.descricao || '')+'</div>'+
                estoqueTxt+
                (esgotado?'<div class="descricao" style="color:#ff6b6b;font-weight:bold;">ESGOTADO</div>':'')+
                '<input class="obs-item" id="obs-'+i+'-'+j+'" '+(esgotado?'disabled':'')+' placeholder="Observação deste item" value="'+(item.observacao || '').replace(/"/g,'&quot;')+'">'+
              '</div>'+
              '<div class="controle">'+
                '<button class="btn-qtd" '+(esgotado?'disabled':'')+' onclick="alterarQtd('+i+','+j+',-1)">-</button>'+
                '<span class="qtd" id="qtd-'+i+'-'+j+'">'+item.quantidade+'</span>'+
                '<button class="btn-qtd" '+(esgotado?'disabled':'')+' onclick="alterarQtd('+i+','+j+',1)">+</button>'+
              '</div>'+
            '</div>';
        }

        bloco.innerHTML = html;
        if((cat.coluna || "esquerda") === "direita") dir.appendChild(bloco);
        else esq.appendChild(bloco);
      }

      alvo.innerHTML = "";
      alvo.appendChild(esq);
      alvo.appendChild(dir);

      document.querySelectorAll(".obs-item").forEach(el => {
        el.addEventListener("input", function(){
          const p = this.id.split("-");
          categorias[Number(p[1])].itens[Number(p[2])].observacao = this.value;
        });
      });

      atualizarTotal();
    }

    window.alterarQtd = function(i,j,d){
      const item = categorias[i].itens[j];
      if(item.esgotado) return;
      item.quantidade += d;
      if(item.quantidade < 0) item.quantidade = 0;
      document.getElementById("qtd-"+i+"-"+j).textContent = item.quantidade;
      atualizarTotal();
    };

    function atualizarTotal(){
      let total = 0;
      for(let i=0;i<categorias.length;i++){
        for(let j=0;j<categorias[i].itens.length;j++){
          total += Number(categorias[i].itens[j].preco) * Number(categorias[i].itens[j].quantidade);
        }
      }

      const tipoPedido = document.getElementById("tipoPedido").value;
      const taxaEntrega = tipoPedido === "delivery" ? valorNumero("taxaEntrega") : 0;

      document.getElementById("total").textContent = formatarMoeda(total + taxaEntrega);
    }

    function atualizarSomaPagamentos(){
      const soma = valorNumero("pagDinheiro") + valorNumero("pagPix") + valorNumero("pagDebito") + valorNumero("pagCredito");
      document.getElementById("somaPagamentos").textContent = formatarMoeda(soma);
    }

    function ajustarTipoPedido(){
      const tipo = document.getElementById("tipoPedido").value;
      const mesa = document.getElementById("mesa");
      const endereco = document.getElementById("endereco");
      const taxaEntrega = document.getElementById("taxaEntrega");

      if(mesaDaURL){
        document.getElementById("tipoPedido").value = "mesa";
        mesa.value = mesaDaURL;
        mesa.disabled = true;
        mesa.classList.add("mesa-fixa");
        endereco.disabled = true;
        endereco.value = "";
        taxaEntrega.disabled = true;
        taxaEntrega.value = "0";
        atualizarTotal();
        return;
      }

      if(tipo === "mesa"){
        mesa.disabled = false;
        endereco.disabled = true;
        endereco.value = "";
        taxaEntrega.disabled = true;
        taxaEntrega.value = "0";
      } else if(tipo === "delivery"){
        mesa.disabled = true;
        mesa.value = "";
        endereco.disabled = false;
        taxaEntrega.disabled = false;
      } else {
        mesa.disabled = true;
        mesa.value = "";
        endereco.disabled = true;
        endereco.value = "";
        taxaEntrega.disabled = true;
        taxaEntrega.value = "0";
      }

      atualizarTotal();
    }

    async function fazerPedido(){
      const cliente = document.getElementById("cliente").value.trim();
      const telefone = document.getElementById("telefone").value.trim();
      const mesa = document.getElementById("mesa").value.trim();
      const observacao = document.getElementById("observacao").value.trim();
      const tipoPedido = document.getElementById("tipoPedido").value;
      const tipoPagamentoPedido = document.getElementById("tipoPagamentoPedido").value;
      const endereco = document.getElementById("endereco").value.trim();
      const taxaEntrega = tipoPedido === "delivery" ? valorNumero("taxaEntrega") : 0;

      const itensSelecionados = [];
      for(let i=0;i<categorias.length;i++){
        for(let j=0;j<categorias[i].itens.length;j++){
          const item = categorias[i].itens[j];
          if(item.quantidade > 0){
            itensSelecionados.push({
              nome:item.nome,
              preco:item.preco,
              quantidade:item.quantidade,
              observacao:item.observacao || "",
              categoria:categorias[i].nome
            });
          }
        }
      }

      if(!itensSelecionados.length){
        alert("Selecione pelo menos 1 item.");
        return;
      }

      if(tipoPedido === "mesa" && !mesa){
        alert("Digite a mesa.");
        return;
      }

      if(tipoPedido === "delivery" && !endereco){
        alert("Digite o endereço de entrega.");
        return;
      }

      let subtotal = 0;
      itensSelecionados.forEach(item => {
        subtotal += Number(item.preco) * Number(item.quantidade);
      });

      const totalPedido = subtotal + taxaEntrega;

      const pagamentos = {
        dinheiro: valorNumero("pagDinheiro"),
        pix: valorNumero("pagPix"),
        debito: valorNumero("pagDebito"),
        credito: valorNumero("pagCredito")
      };

      const pagamentoAntecipado = tipoPagamentoPedido === "agora";
      const somaPagamentos = pagamentos.dinheiro + pagamentos.pix + pagamentos.debito + pagamentos.credito;

      if(pagamentoAntecipado && Math.abs(somaPagamentos - totalPedido) > 0.01){
        alert(
          "A soma das formas de pagamento não bate com o total do pedido.\n\n" +
          "Total do pedido: R$ " + formatarMoeda(totalPedido) + "\n" +
          "Soma informada: R$ " + formatarMoeda(somaPagamentos)
        );
        return;
      }

      let formaPagamento = null;
      if(pagamentoAntecipado){
        const partes = [];
        if(pagamentos.dinheiro > 0) partes.push("Dinheiro: R$ " + formatarMoeda(pagamentos.dinheiro));
        if(pagamentos.pix > 0) partes.push("Pix: R$ " + formatarMoeda(pagamentos.pix));
        if(pagamentos.debito > 0) partes.push("Débito: R$ " + formatarMoeda(pagamentos.debito));
        if(pagamentos.credito > 0) partes.push("Crédito: R$ " + formatarMoeda(pagamentos.credito));
        formaPagamento = partes.join(" | ");
      }

      const resp = await fetch("/api/pedidos", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          cliente,
          telefone,
          mesa,
          endereco,
          observacao,
          itens: itensSelecionados,
          origem: "cliente",
          tipoPedido,
          subtotalPedido: subtotal,
          taxaEntrega: taxaEntrega,
          descontoValor: 0,
          totalPedido: totalPedido,
          pago: pagamentoAntecipado,
          pagamentos: pagamentoAntecipado ? pagamentos : {},
          formaPagamento: pagamentoAntecipado ? formaPagamento : null
        })
      });

      const dados = await resp.json();

      if(!dados.sucesso){
        alert(dados.erro || "Erro ao enviar pedido.");
        return;
      }

      document.getElementById("mensagem").textContent = "Pedido enviado com sucesso!";
      document.getElementById("cliente").value = "";
      document.getElementById("telefone").value = "";
      if(!mesaDaURL) document.getElementById("mesa").value = "";
      document.getElementById("observacao").value = "";
      document.getElementById("tipoPedido").value = mesaDaURL ? "mesa" : "mesa";
      document.getElementById("endereco").value = "";
      document.getElementById("taxaEntrega").value = "0";
      document.getElementById("tipoPagamentoPedido").value = "mesa";
      document.getElementById("pagDinheiro").value = "";
      document.getElementById("pagPix").value = "";
      document.getElementById("pagDebito").value = "";
      document.getElementById("pagCredito").value = "";
      document.getElementById("blocoPagamentoAgora").style.display = "none";
      document.getElementById("somaPagamentos").textContent = "0,00";

      for(let i=0;i<categorias.length;i++){
        for(let j=0;j<categorias[i].itens.length;j++){
          categorias[i].itens[j].quantidade = 0;
          categorias[i].itens[j].observacao = "";
        }
      }

      ajustarTipoPedido();
      renderizar();

      setTimeout(() => { document.getElementById("mensagem").textContent = ""; }, 3000);
    }

    document.getElementById("btnPedido").addEventListener("click", fazerPedido);
    document.getElementById("tipoPedido").addEventListener("change", ajustarTipoPedido);
    document.getElementById("taxaEntrega").addEventListener("input", atualizarTotal);

    document.getElementById("tipoPagamentoPedido").addEventListener("change", function(){
      document.getElementById("blocoPagamentoAgora").style.display = this.value === "agora" ? "block" : "none";
      if(this.value !== "agora"){
        document.getElementById("pagDinheiro").value = "";
        document.getElementById("pagPix").value = "";
        document.getElementById("pagDebito").value = "";
        document.getElementById("pagCredito").value = "";
        document.getElementById("somaPagamentos").textContent = "0,00";
      }
    });

    document.getElementById("pagDinheiro").addEventListener("input", atualizarSomaPagamentos);
    document.getElementById("pagPix").addEventListener("input", atualizarSomaPagamentos);
    document.getElementById("pagDebito").addEventListener("input", atualizarSomaPagamentos);
    document.getElementById("pagCredito").addEventListener("input", atualizarSomaPagamentos);

    socket.on("cardapioAtualizado", carregarCardapio);

    if(mesaDaURL){
      document.getElementById("mesa").value = mesaDaURL;
      document.getElementById("tipoPedido").value = "mesa";
    }

    ajustarTipoPedido();
    carregarCardapio();
  </script>
</body>
</html>
