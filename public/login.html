<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Sistema</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111827;color:#fff;font-family:Arial,sans-serif;padding:20px}
    .box{width:100%;max-width:430px;background:#1f2937;padding:28px;border-radius:18px}
    h1{text-align:center;margin:0 0 10px;font-size:42px}
    .sub{text-align:center;color:#fb923c;font-weight:bold;margin-bottom:22px;font-size:20px}
    label{display:block;font-weight:bold;margin:14px 0 6px}
    input,select{width:100%;padding:12px;border:none;border-radius:10px;font-size:16px}
    button{width:100%;margin-top:20px;padding:14px;border:none;border-radius:12px;background:#22c55e;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
    .msg{margin-top:12px;text-align:center;color:#fca5a5;font-weight:bold;min-height:22px}
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
  <script src="/supabase-adapter.js"></script>
  </head>
<body>
  <div class="box">
    <h1>TÁ ONLINE</h1>
    <div class="sub">Login do sistema</div>

    <label>Usuário</label>
    <input id="usuario" placeholder="Digite o usuário">

    <label>Senha</label>
    <input id="senha" type="password" placeholder="Digite a senha">

    <label>Entrar como</label>
    <select id="setor">
      <option value="painel">Painel</option>
      <option value="garcom">Garçom</option>
      <option value="producao">Produção</option>
    </select>

    <button id="btnEntrar">Entrar</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    document.getElementById("btnEntrar").addEventListener("click", async function () {
      const usuario = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value.trim();
      const setor = document.getElementById("setor").value;
      const msg = document.getElementById("msg");
      msg.textContent = "";

      if (!usuario || !senha) {
        msg.textContent = "Preencha usuário e senha.";
        return;
      }

      try {
        const resposta = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, senha, setor })
        });

        const dados = await resposta.json();

        if (!dados.sucesso) {
          msg.textContent = dados.erro || "Usuário ou senha inválidos.";
          return;
        }

        localStorage.setItem("sessaoSistemaPedido", JSON.stringify({
          usuario: dados.usuario.usuario,
          setor: dados.usuario.setor
        }));

        if (dados.usuario.setor === "painel") window.location.href = "/painel.html";
        if (dados.usuario.setor === "garcom") window.location.href = "/garcom.html";
        if (dados.usuario.setor === "producao") window.location.href = "/producao.html";
      } catch (erro) {
        msg.textContent = "Erro ao conectar com o servidor.";
      }
    });
  </script>
</body>
</html>
