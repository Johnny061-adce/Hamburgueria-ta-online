<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#111827;color:#fff}
    .topo{text-align:right;margin-bottom:10px}
    .sair{border:none;background:#ef4444;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:bold}
    h1{text-align:center;margin:0 0 20px;font-size:46px}
    .abas{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
    .aba-btn{border:none;background:#1f2937;color:#fff;padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:bold}
    .aba-btn.ativa{background:#fb923c;color:#111}
    .aba{display:none}
    .aba.ativa{display:block}
    .pedido{background:#1f2937;border-left:6px solid #fb923c;border-radius:12px;padding:16px;margin-bottom:16px}
    .pedido.finalizado{border-left-color:#22c55e}
    .pedido.cancelado{border-left-color:#ef4444}
    .pedido-numero{font-size:24px;font-weight:bold;color:#fbbf24}
    .pedido-info{margin:6px 0}
    .pedido ul{margin-top:10px;padding-left:22px}
    .caixa{background:#1f2937;border-radius:12px;padding:18px;margin-bottom:20px}
    .linha{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px;align-items:center}
    .linha input,.linha select,.linha textarea{border:none;border-radius:8px;padding:10px;font-size:15px}
    .linha button{border:none;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer;font-weight:bold;background:#fb923c;color:#111}
    .resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
    .card-resumo{background:#111827;border-radius:10px;padding:14px}
    .card-resumo strong{display:block;color:#cbd5e1;margin-bottom:6px;font-size:14px}
    .card-resumo span{font-size:22px;font-weight:bold;color:#fff}
    .cadastro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}
    .usuarios-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}
    .campo{display:flex;flex-direction:column}
    .campo label{margin-bottom:6px;font-weight:bold}
    .campo input,.campo textarea,.campo select{border:none;border-radius:8px;padding:10px;font-size:15px;width:100%}
    .campo textarea{min-height:44px;resize:vertical}
    .grid-cardapio{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}
    .coluna{padding:10px}
    .coluna.direita{border-left:2px solid rgba(255,255,255,.15)}
    .categoria{margin-bottom:24px}
    .categoria-titulo{color:#fbbf24;font-size:28px;font-weight:bold;text-transform:uppercase;border-bottom:2px solid rgba(255,255,255,.15);padding-bottom:8px;margin-bottom:10px}
    .item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);align-items:center}
    .linha-nome-preco{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
    .nome-item{font-weight:bold;text-transform:uppercase}
    .preco-item{color:#fbbf24;font-weight:bold;white-space:nowrap}
    .descricao-item{color:#e5e7eb;font-size:14px}
    .acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn{border:none;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:bold;font-size:14px}
    .btn-editar{background:#3b82f6;color:#fff}
    .btn-finalizar{background:#22c55e;color:#fff}
    .btn-cancelar{background:#ef4444;color:#fff}
    .btn-imprimir{background:#fbbf24;color:#111}
    .btn-whats{background:#0ea5e9;color:#fff}
    .btn-backup{background:#a855f7;color:#fff;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:bold}
    .checkbox-categorias{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;margin-bottom:10px}
    .checkbox-categorias label{background:#111827;border-radius:8px;padding:8px 12px;cursor:pointer}
    .badge{display:inline-block;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:bold;color:#111}
    .badge-amarelo{background:#facc15}
    .badge-verde{background:#22c55e}
    .badge-azul{background:#38bdf8}
    .badge-vermelho{background:#f87171}
    .badge-cinza{background:#cbd5e1}
    .msg{margin-top:12px;color:#86efac;font-weight:bold}
    .vazio{text-align:center;color:#cbd5e1;font-size:22px;padding:50px 20px}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;overflow:auto;padding:20px}
    .modal.ativo{display:block}
    .modal-box{max-width:1100px;margin:0 auto;background:#1f2937;border-radius:14px;padding:20px}
    .modal-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
    .btn-fechar{border:none;background:#4b5563;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:bold}
    .controle-qtd{display:flex;align-items:center;gap:8px}
    .btn-qtd{width:34px;height:34px;border:none;border-radius:50%;background:#fb923c;color:#fff;font-size:22px;font-weight:bold;cursor:pointer}
    .btn-qtd:disabled{opacity:.4}
    .qtd-numero{min-width:24px;text-align:center;font-size:18px;font-weight:bold}
    .obs-item{width:100%;margin-top:8px;border:none;border-radius:8px;padding:8px;font-size:13px}
    .texto-link{word-break:break-all;color:#cbd5e1}
    @media (max-width:900px){
      .cadastro-grid,.usuarios-grid,.grid-cardapio{grid-template-columns:1fr}
      .coluna.direita{border-left:none}
    }
  </style>
</head>
<body>
  <div class="topo"><button class="sair" id="btnSair">Sair</button></div>
  <h1>Painel</h1>

  <div class="abas">
    <button class="aba-btn ativa" data-aba="andamento">Andamento</button>
    <button class="aba-btn" data-aba="finalizados">Finalizados</button>
    <button class="aba-btn" data-aba="cancelados">Cancelados</button>
    <button class="aba-btn" data-aba="caixa">Fechamento de Caixa</button>
    <button class="aba-btn" data-aba="relatorio">Relatório por Categoria</button>
    <button class="aba-btn" data-aba="maisvendidos">Mais Vendidos</button>
    <button class="aba-btn" data-aba="cadastro">Cadastro</button>
    <button class="aba-btn" data-aba="usuarios">Usuários</button>
    <button class="aba-btn" data-aba="mesas">Mesas</button>
    <button class="aba-btn" data-aba="backup">Backup</button>
  </div>

  <div id="aba-andamento" class="aba ativa">
    <div id="listaAndamento"></div>
  </div>

  <div id="aba-finalizados" class="aba">
    <div id="listaFinalizados"></div>
  </div>

  <div id="aba-cancelados" class="aba">
    <div id="listaCancelados"></div>
  </div>

  <div id="aba-caixa" class="aba">
    <div class="caixa">
      <div class="linha">
        <input type="text" id="dataCaixa" placeholder="Data única: 09/03/2026">
      </div>
      <div class="linha">
        <input type="text" id="dataInicioCaixa" placeholder="Data início: 01/03/2026">
        <input type="text" id="dataFimCaixa" placeholder="Data fim: 09/03/2026">
        <button id="btnPesquisarCaixa">Pesquisar</button>
      </div>
      <div id="resumoCaixa" class="resumo"></div>
      <div id="listaCaixa"></div>
    </div>
  </div>

  <div id="aba-relatorio" class="aba">
    <div class="caixa">
      <div class="linha">
        <input type="text" id="dataRelatorioCategoria" placeholder="Ex: 09/03/2026">
        <button id="btnPesquisarRelatorio">Pesquisar</button>
      </div>
      <div id="checkboxCategoriasRelatorio" class="checkbox-categorias"></div>
      <div id="resumoRelatorioCategorias" class="resumo"></div>
    </div>
  </div>

  <div id="aba-maisvendidos" class="aba">
    <div class="caixa">
      <div class="linha">
        <input type="text" id="dataInicioMaisVendidos" placeholder="Data início: 01/03/2026">
        <input type="text" id="dataFimMaisVendidos" placeholder="Data fim: 09/03/2026">
        <button id="btnPesquisarMaisVendidos">Pesquisar</button>
      </div>
      <div id="resumoMaisVendidos"></div>
    </div>
  </div>

  <div id="aba-cadastro" class="aba">
    <div class="caixa">
      <div class="cadastro-grid">
        <div class="campo"><label>Categoria existente</label><select id="cadCategoria"></select></div>
        <div class="campo"><label>Ou nova categoria</label><input type="text" id="cadNovaCategoria"></div>
        <div class="campo"><label>Coluna</label><select id="cadColuna"><option value="esquerda">Esquerda</option><option value="direita">Direita</option></select></div>
        <div class="campo"><label>Nome do item</label><input type="text" id="cadNome"></div>
        <div class="campo"><label>Preço</label><input type="number" step="0.01" id="cadPreco"></div>
        <div class="campo"><label>Descrição</label><textarea id="cadDescricao"></textarea></div>
        <div class="campo"><label>Controlar estoque?</label><select id="cadControlarEstoque"><option value="nao">Não</option><option value="sim">Sim</option></select></div>
        <div class="campo"><label>Estoque</label><input type="number" id="cadEstoque"></div>
      </div>
      <button id="btnCadastrarItem" class="btn btn-finalizar">Cadastrar Item</button>
      <div id="msgCadastro" class="msg"></div>
      <div id="listaItensCadastro"></div>
    </div>
  </div>

  <div id="aba-usuarios" class="aba">
    <div class="caixa">
      <div class="usuarios-grid">
        <div class="campo"><label>Usuário</label><input id="novoUsuario"></div>
        <div class="campo"><label>Senha</label><input id="novaSenha"></div>
        <div class="campo">
          <label>Tipo</label>
          <select id="tipoUsuario">
            <option value="painel">Painel</option>
            <option value="garcom">Garçom</option>
            <option value="producao">Produção</option>
          </select>
        </div>
      </div>
      <button id="btnCadastrarUsuario" class="btn btn-finalizar">Cadastrar</button>
      <div id="listaUsuarios" style="margin-top:16px;"></div>
    </div>
  </div>

  <div id="aba-mesas" class="aba">
    <div class="caixa">
      <div class="usuarios-grid">
        <div class="campo"><label>Número da mesa</label><input id="mesaNumero" type="number" placeholder="Ex: 1"></div>
        <div class="campo"><label>Nome da mesa</label><input id="mesaNome" placeholder="Ex: Mesa varanda"></div>
        <div class="campo">
          <label>Status</label>
          <select id="mesaAtiva">
            <option value="true">Ativa</option>
            <option value="false">Inativa</option>
          </select>
        </div>
      </div>
      <button id="btnCadastrarMesa" class="btn btn-finalizar">Cadastrar Mesa</button>
      <div id="listaMesas" style="margin-top:16px;"></div>
    </div>
  </div>

  <div id="aba-backup" class="aba">
    <div class="caixa">
      <div class="linha">
        <button id="btnBaixarBackup" class="btn-backup">Baixar Backup JSON</button>
      </div>
      <div class="linha">
        <input type="file" id="arquivoBackup" accept=".json">
        <button id="btnRestaurarBackup" class="btn-backup">Restaurar Backup</button>
      </div>
      <div class="msg" id="msgBackup"></div>
    </div>
  </div>

  <div id="modalEditar" class="modal">
    <div class="modal-box">
      <div class="modal-topo">
        <h2>Editar Pedido</h2>
        <button class="btn-fechar" id="btnFecharEditar">Fechar</button>
      </div>

      <div class="cadastro-grid">
        <div class="campo"><label>Cliente</label><input id="editCliente"></div>
        <div class="campo"><label>Telefone</label><input id="editTelefone"></div>
        <div class="campo"><label>Tipo</label><select id="editTipoPedido"><option value="mesa">Mesa</option><option value="delivery">Delivery</option><option value="retirada">Retirada</option></select></div>
        <div class="campo"><label>Mesa</label><input id="editMesa"></div>
        <div class="campo"><label>Taxa</label><input id="editTaxaEntrega" type="number" step="0.01" value="0"></div>
        <div class="campo"><label>Desconto %</label><input id="editDescontoPercentual" type="number" step="0.01" value="0"></div>
        <div class="campo"><label>Endereço</label><input id="editEndereco"></div>
      </div>

      <div class="campo">
        <label>Observação geral</label>
        <textarea id="editObservacao"></textarea>
      </div>

      <div id="cardapioEditar" class="grid-cardapio"></div>

      <div class="linha" style="justify-content:space-between;margin-top:20px;">
        <div style="font-size:28px;font-weight:bold;color:#fde68a;">Total: R$ <span id="totalEditar">0,00</span></div>
        <button id="btnSalvarEdicao" class="btn btn-finalizar">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
  <script src="/supabase-adapter.js"></script>
  
  <script>
    const sessao = JSON.parse(localStorage.getItem("sessaoSistemaPedido") || "null");
    if(!sessao || sessao.setor !== "painel"){
      window.location.href = "/login.html";
    }

    const socket = io();
    let pedidos = [];
    let pedidosMap = {};
    let pedidoEditandoId = null;
    let cardapioEdicao = [];

    function tocarAlerta(){
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.type = "triangle";
        o.frequency.value = 920;
        g.gain.value = 0.08;
        o.start();
        setTimeout(() => { o.stop(); ctx.close(); }, 180);
      }catch(e){}
    }

    function formatarMoeda(valor){
      return Number(valor || 0).toFixed(2).replace(".", ",");
    }

    function escaparHtml(texto){
      return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function fetchJsonSeguro(url, opcoes){
      const resposta = await fetch(url, opcoes);
      const texto = await resposta.text();

      try{
        return JSON.parse(texto);
      }catch(e){
        console.error("Resposta inválida da rota:", url);
        console.error("Texto recebido:", texto);
        throw new Error("Resposta inválida em " + url);
      }
    }

    function textoPagamentos(pedido){
      const pagamentos = pedido.pagamentos || {};
      const partes = [];
      if(Number(pagamentos.pix || 0) > 0) partes.push("Pix: R$ " + formatarMoeda(pagamentos.pix));
      if(Number(pagamentos.dinheiro || 0) > 0) partes.push("Dinheiro: R$ " + formatarMoeda(pagamentos.dinheiro));
      if(Number(pagamentos.debito || 0) > 0) partes.push("Débito: R$ " + formatarMoeda(pagamentos.debito));
      if(Number(pagamentos.credito || 0) > 0) partes.push("Crédito: R$ " + formatarMoeda(pagamentos.credito));
      return partes.length ? partes.join(" | ") : (pedido.formaPagamento || "-");
    }

    function badgeStatus(status){
      const s = String(status || "").toLowerCase();
      if(s.includes("pronto")) return '<span class="badge badge-verde">Pronto</span>';
      if(s.includes("finalizado")) return '<span class="badge badge-verde">Finalizado</span>';
      if(s.includes("andamento") || s.includes("produção")) return '<span class="badge badge-amarelo">Em andamento</span>';
      if(s.includes("cancelado")) return '<span class="badge badge-vermelho">Cancelado</span>';
      return '<span class="badge badge-cinza">' + (status || "-") + '</span>';
    }

    function trocarAba(nome){
      document.querySelectorAll(".aba").forEach(el => el.classList.remove("ativa"));
      document.querySelectorAll(".aba-btn").forEach(el => el.classList.remove("ativa"));

      const aba = document.getElementById("aba-" + nome);
      const btn = document.querySelector('.aba-btn[data-aba="' + nome + '"]');

      if(aba) aba.classList.add("ativa");
      if(btn) btn.classList.add("ativa");

      if(nome === "cadastro"){
        carregarCategoriasCadastro();
        carregarListaItensCadastro();
      }
      if(nome === "usuarios"){
        carregarUsuarios();
      }
      if(nome === "relatorio"){
        carregarCategoriasRelatorio();
      }
      if(nome === "mesas"){
        carregarMesas();
      }
    }

    function abrirWhatsAppPedidoPorId(id){
      const pedido = pedidosMap[id];
      if(!pedido){
        alert("Pedido não encontrado.");
        return;
      }

      if(!pedido.telefone){
        alert("Este pedido não tem telefone.");
        return;
      }

      const numero = String(pedido.telefone).replace(/\D/g, "");
      let mensagem = "Pedido N°" + (pedido.numeroPedido || pedido.id || "") + "\n\n";

      (pedido.itens || []).forEach(item => {
        const valorItem = Number(item.preco || 0) * Number(item.quantidade || 0);
        mensagem += item.quantidade + "x " + item.nome + " - R$ " + formatarMoeda(valorItem) + "\n";
        if(item.observacao && item.observacao.trim()){
          mensagem += "Obs.: " + item.observacao.trim() + "\n";
        }
      });

      mensagem += "\nSubtotal: R$ " + formatarMoeda(pedido.subtotalPedido || 0) + "\n";
      if(Number(pedido.taxaEntrega || 0) > 0){
        mensagem += "Taxa de delivery: R$ " + formatarMoeda(pedido.taxaEntrega || 0) + "\n";
      }
      mensagem += "Total: R$ " + formatarMoeda(pedido.totalPedido || 0) + "\n\n";

      if(pedido.tipoPedido === "delivery"){
        mensagem += "Endereço de entrega:\n" + (pedido.endereco || "Não informado") + "\n\n";
        mensagem += "Por favor envia sua localização, para facilitar a entrega 🛵💨";
      } else if(pedido.tipoPedido === "retirada"){
        mensagem += "Pedido para retirada no local.";
      } else {
        mensagem += "Mesa: " + (pedido.mesa || "-");
      }

      window.open("https://wa.me/55" + numero + "?text=" + encodeURIComponent(mensagem), "_blank");
    }
    window.abrirWhatsAppPedidoPorId = abrirWhatsAppPedidoPorId;

    function criarItensHtml(pedido){
      const itens = pedido.itens || [];
      if(!itens.length) return "<div class='pedido-info'>Sem itens.</div>";
      return "<ul>" + itens.map(item =>
        "<li>" +
          escaparHtml(item.quantidade + "x " + item.nome) +
          " - R$ " + formatarMoeda(Number(item.preco) * Number(item.quantidade)) +
          (item.observacao ? " | Obs.: " + escaparHtml(item.observacao) : "") +
        "</li>"
      ).join("") + "</ul>";
    }

    function criarHtmlPedido(pedido, tipo){
      let classe = "";
      if(pedido.status === "Finalizado") classe = "finalizado";
      if(pedido.status === "Cancelado") classe = "cancelado";

      let acoes = "";
      if(tipo === "andamento"){
        acoes =
          '<div class="acoes">' +
            '<button class="btn btn-editar" onclick="abrirEditar(' + pedido.id + ')">Editar</button>' +
            '<button class="btn btn-finalizar" onclick="finalizarPedido(' + pedido.id + ')">Finalizar</button>' +
            '<button class="btn btn-cancelar" onclick="cancelarPedido(' + pedido.id + ')">Cancelar</button>' +
            '<button class="btn btn-imprimir" onclick="imprimirPedido(' + pedido.id + ')">Imprimir</button>' +
            '<button class="btn btn-whats" onclick="abrirWhatsAppPedidoPorId(' + pedido.id + ')">WhatsApp</button>' +
          '</div>';
      } else {
        acoes =
          '<div class="acoes">' +
            '<button class="btn btn-imprimir" onclick="imprimirPedido(' + pedido.id + ')">Imprimir</button>' +
            '<button class="btn btn-whats" onclick="abrirWhatsAppPedidoPorId(' + pedido.id + ')">WhatsApp</button>' +
          '</div>';
      }

      return (
        '<div class="pedido ' + classe + '">' +
          '<div class="pedido-numero">Pedido #' + escaparHtml(pedido.numeroPedido || "-") + '</div>' +
          '<div class="pedido-info"><strong>Status:</strong> ' + badgeStatus(pedido.statusVisual || pedido.status || "-") + '</div>' +
          '<div class="pedido-info"><strong>Origem:</strong> ' + escaparHtml(pedido.origem || "-") + '</div>' +
          '<div class="pedido-info"><strong>Tipo:</strong> ' + escaparHtml(pedido.tipoPedido || "-") + '</div>' +
          '<div class="pedido-info"><strong>Garçom:</strong> ' + escaparHtml(pedido.garcom || "-") + '</div>' +
          '<div class="pedido-info"><strong>Cliente:</strong> ' + escaparHtml(pedido.cliente || "-") + '</div>' +
          '<div class="pedido-info"><strong>Mesa:</strong> ' + escaparHtml(pedido.mesa || "-") + '</div>' +
          '<div class="pedido-info"><strong>Telefone:</strong> ' + escaparHtml(pedido.telefone || "-") + '</div>' +
          '<div class="pedido-info"><strong>Endereço:</strong> ' + escaparHtml(pedido.endereco || "-") + '</div>' +
          '<div class="pedido-info"><strong>Observação geral:</strong> ' + escaparHtml(pedido.observacao || "Nenhuma") + '</div>' +
          '<div class="pedido-info"><strong>Pagamento:</strong> ' + escaparHtml(textoPagamentos(pedido)) + '</div>' +
          '<div class="pedido-info"><strong>Subtotal:</strong> R$ ' + formatarMoeda(pedido.subtotalPedido || 0) + '</div>' +
          '<div class="pedido-info"><strong>Taxa:</strong> R$ ' + formatarMoeda(pedido.taxaEntrega || 0) + '</div>' +
          '<div class="pedido-info"><strong>Desconto:</strong> R$ ' + formatarMoeda(pedido.descontoValor || 0) + '</div>' +
          criarItensHtml(pedido) +
          '<div class="pedido-info"><strong>Total:</strong> R$ ' + formatarMoeda(pedido.totalPedido || 0) + '</div>' +
          acoes +
        '</div>'
      );
    }

    function renderizarTudo(){
      pedidosMap = {};
      pedidos.forEach(p => pedidosMap[p.id] = p);

        cancelados.length ? cancelados.map(p => criarHtmlPedido(p, "cancelados")).join("") : '<div class="vazio">Nenhum pedido cancelado.</div>';

    window.abrirEditar = async function(id){
      const pedido = pedidos.find(p => Number(p.id) === Number(id));
      if(!pedido) return;

      try{
        cardapioEdicao = await fetchJsonSeguro("/api/cardapio");
      }catch(e){
        alert("Erro ao carregar cardápio para edição.");
        return;
      }

      cardapioEdicao.forEach(c => (c.itens || []).forEach(i => {
        i.quantidade = 0;
        i.observacao = "";
      }));

      (pedido.itens || []).forEach(itemPedido => {
        cardapioEdicao.forEach(c => (c.itens || []).forEach(i => {
          if(i.nome === itemPedido.nome && Number(i.preco) === Number(itemPedido.preco)){
            i.quantidade = Number(itemPedido.quantidade);
            i.observacao = itemPedido.observacao || "";
          }
        }));
      });

      pedidoEditandoId = id;
      document.getElementById("editCliente").value = pedido.cliente || "";
      document.getElementById("editTelefone").value = pedido.telefone || "";
      document.getElementById("editTipoPedido").value = pedido.tipoPedido || "mesa";
      document.getElementById("editMesa").value = pedido.mesa || "";
      document.getElementById("editEndereco").value = pedido.endereco || "";
      document.getElementById("editTaxaEntrega").value = pedido.taxaEntrega || 0;
      document.getElementById("editDescontoPercentual").value = pedido.descontoPercentual || 0;
      document.getElementById("editObservacao").value = pedido.observacao || "";

      renderizarCardapioEdicao();
      document.getElementById("modalEditar").classList.add("ativo");
    };

    function renderizarCardapioEdicao(){
      const container = document.getElementById("cardapioEditar");
      let colunaEsquerda = '<div class="coluna esquerda">';
      let colunaDireita = '<div class="coluna direita">';

      cardapioEdicao.forEach((categoria, i) => {
        let bloco = '<div class="categoria"><div class="categoria-titulo">' + escaparHtml(categoria.nome) + '</div>';
        (categoria.itens || []).forEach((item, j) => {
          const esgotado = item.esgotado === true;
          bloco +=
            '<div class="item" style="' + (esgotado ? 'opacity:.5;' : '') + '">' +
              '<div>' +
                '<div class="linha-nome-preco"><span class="nome-item">' + escaparHtml(item.nome) + '</span><span class="preco-item">R$ ' + formatarMoeda(item.preco) + '</span></div>' +
                '<div class="descricao-item">' + escaparHtml(item.descricao || "") + '</div>' +
                '<input class="obs-item" ' + (esgotado ? 'disabled' : '') + ' id="eobs-' + i + '-' + j + '" placeholder="Observação deste item" value="' + escaparHtml(item.observacao || "") + '">' +
              '</div>' +
              '<div class="controle-qtd">' +
                '<button class="btn-qtd" ' + (esgotado ? 'disabled' : '') + ' onclick="alterarQuantidadeEdicao(' + i + ',' + j + ',-1)">-</button>' +
                '<span class="qtd-numero" id="eqtd-' + i + '-' + j + '">' + item.quantidade + '</span>' +
                '<button class="btn-qtd" ' + (esgotado ? 'disabled' : '') + ' onclick="alterarQuantidadeEdicao(' + i + ',' + j + ',1)">+</button>' +
              '</div>' +
            '</div>';
        });
        bloco += '</div>';

        if((categoria.coluna || "esquerda") === "direita") colunaDireita += bloco;
        else colunaEsquerda += bloco;
      });

      colunaEsquerda += '</div>';
      colunaDireita += '</div>';
      container.innerHTML = colunaEsquerda + colunaDireita;

      document.querySelectorAll('[id^="eobs-"]').forEach(input => {
        input.addEventListener("input", function(){
          const partes = this.id.split("-");
          cardapioEdicao[Number(partes[1])].itens[Number(partes[2])].observacao = this.value;
        });
      });

      atualizarTotalEdicao();
    }

    window.alterarQuantidadeEdicao = function(i, j, delta){
      const item = cardapioEdicao[i].itens[j];
      if(item.esgotado) return;
      item.quantidade += delta;
      if(item.quantidade < 0) item.quantidade = 0;
      document.getElementById("eqtd-" + i + "-" + j).textContent = item.quantidade;
      atualizarTotalEdicao();
    };

    function atualizarTotalEdicao(){
      let subtotal = 0;

      cardapioEdicao.forEach(c => (c.itens || []).forEach(i => {
        subtotal += Number(i.preco) * Number(i.quantidade);
      }));

      const taxa = Number(document.getElementById("editTaxaEntrega").value || 0);
      const descontoPercentual = Number(document.getElementById("editDescontoPercentual").value || 0);

      let valorDescontoPercentual = subtotal * (descontoPercentual / 100);
      let total = subtotal - valorDescontoPercentual + taxa;

      if(total < 0) total = 0;

      document.getElementById("totalEditar").textContent = formatarMoeda(total);
    }

    async function salvarEdicao(){
      if(!pedidoEditandoId) return;

      const itens = [];
      cardapioEdicao.forEach(c => (c.itens || []).forEach(i => {
        if(i.quantidade > 0){
          itens.push({
            nome: i.nome,
            preco: i.preco,
            quantidade: i.quantidade,
            observacao: i.observacao || "",
            categoria: c.nome
          });
        }
      }));

      if(!itens.length){
        alert("Selecione pelo menos 1 item.");
        return;
      }

      try{
        const dados = await fetchJsonSeguro("/api/pedidos/" + pedidoEditandoId + "/editar", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            cliente: document.getElementById("editCliente").value.trim(),
            telefone: document.getElementById("editTelefone").value.trim(),
            tipoPedido: document.getElementById("editTipoPedido").value,
            mesa: document.getElementById("editMesa").value.trim(),
            endereco: document.getElementById("editEndereco").value.trim(),
            taxaEntrega: Number(document.getElementById("editTaxaEntrega").value || 0),
            descontoPercentual: Number(document.getElementById("editDescontoPercentual").value || 0),
            observacao: document.getElementById("editObservacao").value.trim(),
            itens: itens
          })
        });

        if(!dados.sucesso){
          alert(dados.erro || "Erro ao salvar edição.");
          return;
        }

        document.getElementById("modalEditar").classList.remove("ativo");
        pedidoEditandoId = null;
        carregarPedidos();
      }catch(e){
        console.error(e);
        alert("Erro ao salvar edição.");
      }
    }

    async function finalizarPedido(id){
      const pedido = pedidos.find(function(p){
        return Number(p.id) === Number(id);
      });

      if(!pedido){
        alert("Pedido não encontrado.");
        return;
      }

      const totalPedido = Number(pedido.totalPedido || 0);

      const pix = Number((prompt("Valor no Pix:", "0") || "0").replace(",", ".")) || 0;
      const dinheiro = Number((prompt("Valor em Dinheiro:", "0") || "0").replace(",", ".")) || 0;
      const debito = Number((prompt("Valor no Cartão Débito:", "0") || "0").replace(",", ".")) || 0;
      const credito = Number((prompt("Valor no Cartão Crédito:", "0") || "0").replace(",", ".")) || 0;

      const soma = pix + dinheiro + debito + credito;

      if(Math.abs(soma - totalPedido) > 0.01){
        alert(
          "A soma das formas de pagamento não bate com o total do pedido.\n\n" +
          "Total do pedido: R$ " + formatarMoeda(totalPedido) + "\n" +
          "Soma informada: R$ " + formatarMoeda(soma)
        );
        return;
      }

      const pagamentos = {
        pix: pix,
        dinheiro: dinheiro,
        debito: debito,
        credito: credito
      };

      const formaPagamento = textoPagamentos({ pagamentos: pagamentos, formaPagamento: "" });

      try{
        const dados = await fetchJsonSeguro("/api/pedidos/" + id + "/finalizar", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            formaPagamento: formaPagamento,
            pagamentos: pagamentos
          })
        });

        if(!dados.sucesso){
          alert(dados.erro || "Erro ao finalizar pedido.");
          return;
        }

        await carregarPedidos();

        if(String(pedido.tipoPedido || "").toLowerCase() === "mesa"){
          setTimeout(() => imprimirPedido(id), 300);
        }
      }catch(e){
        console.error(e);
        alert("Erro ao finalizar pedido.");
      }
    }
    window.finalizarPedido = finalizarPedido;

      try{
        const categorias = await fetchJsonSeguro("/api/cardapio");
        const lista = document.getElementById("listaItensCadastro");

        let colunaEsquerda = '<div class="coluna esquerda">';
        let colunaDireita = '<div class="coluna direita">';

        categorias.forEach(categoria => {
          let bloco = '<div class="categoria"><div class="categoria-titulo">' + escaparHtml(categoria.nome) + '</div>';

          (categoria.itens || []).forEach(item => {
            const esgotado = item.esgotado === true;
            bloco +=
              '<div class="item" style="' + (esgotado ? 'opacity:.5;' : '') + '">' +
                '<div>' +
                  '<div class="linha-nome-preco"><span class="nome-item">' + escaparHtml(item.nome) + '</span><span class="preco-item">R$ ' + formatarMoeda(item.preco) + '</span></div>' +
                  '<div class="descricao-item">' + escaparHtml(item.descricao || "") + '</div>' +
                  '<div class="descricao-item" style="margin-top:6px;color:' + (esgotado ? '#ff6b6b' : '#86efac') + ';font-weight:bold;">' + (esgotado ? 'ESGOTADO' : 'DISPONÍVEL') + '</div>' +
                '</div>' +
                '<div class="acoes">' +
                  '<button class="btn btn-editar" onclick="editarItemCardapio(' + item.id + ')">Editar</button>' +
                  '<button class="btn ' + (esgotado ? 'btn-finalizar' : 'btn-cancelar') + '" onclick="alternarEsgotado(' + item.id + ',' + (!esgotado) + ')">' + (esgotado ? 'Ativar' : 'Esgotar') + '</button>' +
                '</div>' +
              '</div>';
          });

          bloco += '</div>';
          if((categoria.coluna || "esquerda") === "direita") colunaDireita += bloco;
          else colunaEsquerda += bloco;
        });

        colunaEsquerda += '</div>';
        colunaDireita += '</div>';
        lista.innerHTML = '<div class="grid-cardapio">' + colunaEsquerda + colunaDireita + '</div>';
      }catch(e){
        console.error(e);
        document.getElementById("listaItensCadastro").innerHTML = '<div class="vazio">Erro ao carregar cardápio.</div>';
      }
    }

    window.alternarEsgotado = async function(itemId, esgotado){
      try{
        const dados = await fetchJsonSeguro("/api/cardapio/itens/" + itemId + "/esgotado", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ esgotado })
        });

        if(!dados.sucesso){
          alert(dados.erro || "Erro ao alterar status.");
          return;
        }

        carregarListaItensCadastro();
      }catch(e){
        console.error(e);
        alert("Erro ao alterar status.");
      }
    };

    window.editarItemCardapio = async function(itemId){
      try{
        const categorias = await fetchJsonSeguro("/api/cardapio");

        let itemEncontrado = null;
        let categoriaAtual = "";
        let colunaAtual = "esquerda";

        for(let i = 0; i < categorias.length; i++){
          for(let j = 0; j < categorias[i].itens.length; j++){
            const item = categorias[i].itens[j];
            if(Number(item.id) === Number(itemId)){
              itemEncontrado = item;
              categoriaAtual = categorias[i].nome;
              colunaAtual = categorias[i].coluna || "esquerda";
            }
          }
        }

        if(!itemEncontrado){
          alert("Item não encontrado.");
          return;
        }

        let novoNome = prompt("Nome do item:", itemEncontrado.nome);
        if(novoNome === null) return;
        novoNome = novoNome.trim();

        let novoPreco = prompt("Preço do item:", itemEncontrado.preco);
        if(novoPreco === null) return;
        novoPreco = novoPreco.trim().replace(",", ".");

        let novaDescricao = prompt("Descrição do item:", itemEncontrado.descricao || "");
        if(novaDescricao === null) return;
        novaDescricao = novaDescricao.trim();

        let novaCategoria = prompt("Categoria do item:", categoriaAtual);
        if(novaCategoria === null) return;
        novaCategoria = novaCategoria.trim();

        let novaColuna = prompt("Coluna do item (esquerda ou direita):", colunaAtual);
        if(novaColuna === null) return;
        novaColuna = novaColuna.trim().toLowerCase();

        let controlarEstoque = prompt("Controlar estoque? (sim/nao)", itemEncontrado.controlarEstoque ? "sim" : "nao");
        if(controlarEstoque === null) return;

        let estoque = prompt("Estoque:", itemEncontrado.estoque || 0);
        if(estoque === null) return;

        if(!novoNome || !novoPreco || !novaCategoria){
          alert("Nome, preço e categoria são obrigatórios.");
          return;
        }

        const dados = await fetchJsonSeguro("/api/cardapio/itens/" + itemId, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nome: novoNome,
            preco: novoPreco,
            descricao: novaDescricao,
            categoria: novaCategoria,
            coluna: novaColuna,
            controlarEstoque: String(controlarEstoque).toLowerCase() === "sim",
            estoque: estoque
          })
        });

        if(!dados.sucesso){
          alert(dados.erro || "Erro ao editar item.");
          return;
        }

        carregarCategoriasCadastro();
        carregarListaItensCadastro();
        carregarCategoriasRelatorio();
      }catch(e){
        console.error(e);
        alert("Erro ao editar item.");
      }
    };

    async function carregarUsuarios(){
      try{
        const usuarios = await fetchJsonSeguro("/api/usuarios");

        document.getElementById("listaUsuarios").innerHTML =
          usuarios.length ? usuarios.map(u => `
            <div class="pedido">
              <div class="pedido-info"><strong>Usuário:</strong> ${escaparHtml(u.usuario)}</div>
              <div class="pedido-info"><strong>Tipo:</strong> ${escaparHtml(u.tipo)}</div>
              <div class="acoes">
                <button class="btn btn-cancelar" onclick="excluirUsuario('${escaparHtml(u.usuario)}')">Excluir</button>
              </div>
            </div>
          `).join("") : '<div class="vazio">Nenhum usuário cadastrado.</div>';
      }catch(e){
        console.error(e);
        document.getElementById("listaUsuarios").innerHTML = '<div class="vazio">Erro ao carregar usuários.</div>';
      }
    }

    async function criarUsuario(){
      const usuario = document.getElementById("novoUsuario").value.trim();
      const senha = document.getElementById("novaSenha").value.trim();
      const tipo = document.getElementById("tipoUsuario").value;

      if(!usuario || !senha){
        alert("Preencha usuário e senha.");
        return;
      }

      try{
        const dados = await fetchJsonSeguro("/api/usuarios", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, senha, tipo })
        });

        if(!dados.sucesso){
          alert(dados.erro || "Erro ao cadastrar usuário.");
          return;
        }

        document.getElementById("novoUsuario").value = "";
        document.getElementById("novaSenha").value = "";
        carregarUsuarios();
      }catch(e){
        console.error(e);
        alert("Erro ao cadastrar usuário.");
      }
    }

    window.excluirUsuario = async function(usuario){
      try{
        const dados = await fetchJsonSeguro("/api/usuarios/" + encodeURIComponent(usuario), { method: "DELETE" });
        if(!dados.sucesso){
          alert(dados.erro || "Erro ao excluir usuário.");
          return;
        }
        carregarUsuarios();
      }catch(e){
        console.error(e);
        alert("Erro ao excluir usuário.");
      }
    };

    async function carregarMesas(){
      try{
        const mesas = await fetchJsonSeguro("/api/mesas");
        const origem = window.location.origin || "http://localhost:3000";

        document.getElementById("listaMesas").innerHTML =
          mesas.length ? mesas.map(m => `
            <div class="pedido">
              <div class="pedido-info"><strong>Número:</strong> ${escaparHtml(m.numero)}</div>
              <div class="pedido-info"><strong>Nome:</strong> ${escaparHtml(m.nome)}</div>
              <div class="pedido-info"><strong>Status:</strong> ${m.ativa ? "Ativa" : "Inativa"}</div>
              <div class="pedido-info texto-link"><strong>Link:</strong> ${origem}/garcom.html?mesa=${encodeURIComponent(m.numero)}</div>
              <div class="acoes">
                <button class="btn btn-editar" onclick="editarMesa(${m.id}, '${escaparHtml(m.numero)}', '${escaparHtml(String(m.nome).replace(/'/g, "\\'"))}', ${m.ativa})">Editar</button>
                <button class="btn btn-whats" onclick="copiarLinkMesa('${escaparHtml(m.numero)}')">Copiar Link</button>
                <button class="btn btn-cancelar" onclick="excluirMesa(${m.id})">Excluir</button>
              </div>
            </div>
          `).join("") : '<div class="vazio">Nenhuma mesa cadastrada.</div>';
      }catch(e){
        console.error(e);
        document.getElementById("listaMesas").innerHTML = '<div class="vazio">Erro ao carregar mesas.</div>';
      }
    }

    async function cadastrarMesa(){
      const numero = document.getElementById("mesaNumero").value;
      const nome = document.getElementById("mesaNome").value.trim();
      const ativa = document.getElementById("mesaAtiva").value === "true";

      if(!numero){
        alert("Informe o número da mesa.");
        return;
      }

      try{
        const dados = await fetchJsonSeguro("/api/mesas", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ numero, nome, ativa })
        });

        if(!dados.sucesso){
          alert(dados.erro || "Erro ao cadastrar mesa.");
          return;
        }

        document.getElementById("mesaNumero").value = "";
        document.getElementById("mesaNome").value = "";
        document.getElementById("mesaAtiva").value = "true";

        carregarMesas();
      }catch(e){
        console.error(e);
        alert("Erro ao cadastrar mesa.");
      }
    }

    async function excluirMesa(id){
      if(!confirm("Deseja excluir esta mesa?")) return;

      try{
        const dados = await fetchJsonSeguro("/api/mesas/" + id, { method: "DELETE" });
        if(!dados.sucesso){
          alert(dados.erro || "Erro ao excluir mesa.");
          return;
        }
        carregarMesas();
      }catch(e){
        console.error(e);
        alert("Erro ao excluir mesa.");
      }
    }

    async function editarMesa(id, numeroAtual, nomeAtual, ativaAtual){
      let novoNumero = prompt("Número da mesa:", numeroAtual);
      if(novoNumero === null) return;

      let novoNome = prompt("Nome da mesa:", nomeAtual);
      if(novoNome === null) return;

      let novoStatus = prompt("Mesa ativa? (sim/nao)", ativaAtual ? "sim" : "nao");
      if(novoStatus === null) return;

      const ativa = String(novoStatus).trim().toLowerCase() === "sim";

      try{
        const dados = await fetchJsonSeguro("/api/mesas/" + id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            numero: novoNumero,
            nome: novoNome,
            ativa: ativa
          })
        });

        if(!dados.sucesso){
          alert(dados.erro || "Erro ao editar mesa.");
          return;
        }

        carregarMesas();
      }catch(e){
        console.error(e);
        alert("Erro ao editar mesa.");
      }
    }

    function copiarLinkMesa(numero){
  const link = "http://192.168.18.148:3000/garcom.html?mesa=" + numero;

  navigator.clipboard.writeText(link)
    .then(() => alert("Link copiado:\n" + link))
    .catch(() => alert("Não foi possível copiar o link.\n" + link));
}

    window.excluirMesa = excluirMesa;
    window.editarMesa = editarMesa;
    window.copiarLinkMesa = copiarLinkMesa;

    async function baixarBackup(){
      try{
        const resposta = await fetch("/api/backup");
        const blob = await resposta.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "backup-pedido-online.json";
        a.click();
        URL.revokeObjectURL(url);
        document.getElementById("msgBackup").textContent = "Backup baixado com sucesso.";
      }catch(e){
        console.error(e);
        alert("Erro ao baixar backup.");
      }
    }

    async function restaurarBackup(){
      const input = document.getElementById("arquivoBackup");
      const arquivo = input.files[0];
      if(!arquivo){
        alert("Selecione o arquivo de backup.");
        return;
      }

      const texto = await arquivo.text();
      let json = null;

      try{
        json = JSON.parse(texto);
      }catch(e){
        alert("Arquivo JSON inválido.");
        return;
      }

      try{
        const dados = await fetchJsonSeguro("/api/backup/restaurar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(json)
        });

        if(!dados.sucesso){
          alert(dados.erro || "Erro ao restaurar backup.");
          return;
        }

        document.getElementById("msgBackup").textContent = "Backup restaurado com sucesso.";
        carregarPedidos();
        carregarCategoriasCadastro();
        carregarListaItensCadastro();
        carregarCategoriasRelatorio();
        carregarUsuarios();
        carregarMesas();
      }catch(e){
        console.error(e);
        alert("Erro ao restaurar backup.");
      }
    }

    async function iniciarPainel(){
      await carregarPedidos();
      await carregarCategoriasCadastro();
      await carregarListaItensCadastro();
      await carregarCategoriasRelatorio();
      await carregarUsuarios();
      await carregarMesas();
    }

    document.querySelectorAll(".aba-btn").forEach(btn => {
      btn.addEventListener("click", function(){
        trocarAba(this.getAttribute("data-aba"));
      });
    });

    document.getElementById("btnPesquisarCaixa").addEventListener("click", pesquisarFechamento);
    document.getElementById("btnPesquisarRelatorio").addEventListener("click", pesquisarRelatorioCategorias);
    document.getElementById("btnPesquisarMaisVendidos").addEventListener("click", pesquisarMaisVendidos);
    document.getElementById("btnCadastrarItem").addEventListener("click", cadastrarNovoItem);
    document.getElementById("btnCadastrarUsuario").addEventListener("click", criarUsuario);
    document.getElementById("btnCadastrarMesa").addEventListener("click", cadastrarMesa);
    document.getElementById("btnBaixarBackup").addEventListener("click", baixarBackup);
    document.getElementById("btnRestaurarBackup").addEventListener("click", restaurarBackup);
    document.getElementById("btnFecharEditar").addEventListener("click", function(){
      document.getElementById("modalEditar").classList.remove("ativo");
      pedidoEditandoId = null;
    });
    document.getElementById("btnSalvarEdicao").addEventListener("click", salvarEdicao);
    document.getElementById("editTaxaEntrega").addEventListener("input", atualizarTotalEdicao);
    document.getElementById("editDescontoPercentual").addEventListener("input", atualizarTotalEdicao);
    document.getElementById("btnSair").addEventListener("click", function(){
      localStorage.removeItem("sessaoSistemaPedido");
      window.location.href = "/login.html";
    });

    socket.on("pedidoAtualizado", function(){ carregarPedidos(); });
    socket.on("novoPedido", function(){ tocarAlerta(); carregarPedidos(); });
    socket.on("cardapioAtualizado", function(){
      carregarCategoriasCadastro();
      carregarListaItensCadastro();
      carregarCategoriasRelatorio();
    });

    iniciarPainel();
  </script>
