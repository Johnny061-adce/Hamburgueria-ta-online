<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produção</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#111827;color:#fff}
    h1{text-align:center;margin:0 0 18px;font-size:46px}
    .topo{display:flex;justify-content:flex-end;margin-bottom:10px}
    .sair{border:none;background:#ef4444;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:bold}
    .caixa{background:#1f2937;border-radius:16px;padding:20px;margin-bottom:18px}
    .checkbox-categorias{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;margin-bottom:10px}
    .checkbox-categorias label{background:#111827;border-radius:8px;padding:8px 12px;cursor:pointer}
    .pedido{background:#1f2937;border-left:6px solid #fb923c;border-radius:12px;padding:16px;margin-bottom:16px}
    .pedido-numero{font-size:24px;font-weight:bold;color:#fbbf24}
    .pedido-info{margin:6px 0}
    .acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn{border:none;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:bold;font-size:14px}
    .btn-producao{background:#facc15;color:#111}
    .btn-pronto{background:#22c55e;color:#fff}
    .badge{display:inline-block;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:bold;color:#111}
    .badge-amarelo{background:#facc15}
    .badge-verde{background:#22c55e}
    .badge-cinza{background:#cbd5e1}
    .vazio{text-align:center;color:#cbd5e1;font-size:22px;padding:50px 20px}
  </style>
</head>
<body>
  <div class="topo"><button class="sair" id="btnSair">Sair</button></div>
  <h1>Produção</h1>

  <div class="caixa">
    <strong>Selecionar categorias deste setor</strong>
    <div id="filtrosCategorias" class="checkbox-categorias"></div>
    <button id="btnSalvarFiltro" class="btn">Salvar filtro</button>
  </div>

  <div id="listaProducao"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
  <script src="/supabase-adapter.js"></script>
  
  <script>
    const sessao = JSON.parse(localStorage.getItem("sessaoSistemaPedido") || "null");
    if(!sessao || sessao.setor !== "producao"){
      window.location.href = "/login.html";
    }

    const socket = io();
    let pedidos = [];
    let categorias = [];
    let filtroCategorias = JSON.parse(localStorage.getItem("filtroCategoriasProducao") || "[]");

    function tocarAlerta(){
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.type = "square";
        o.frequency.value = 760;
        g.gain.value = 0.08;
        o.start();
        setTimeout(() => { o.stop(); ctx.close(); }, 200);
      }catch(e){}
    }

    function badgeStatus(status){
      const s = String(status || "").toLowerCase();
      if(s.includes("pronto")) return '<span class="badge badge-verde">Pronto</span>';
      if(s.includes("andamento") || s.includes("produção")) return '<span class="badge badge-amarelo">Em andamento</span>';
      return '<span class="badge badge-cinza">' + (status || "-") + '</span>';
    }

    async function carregarCategorias(){
      try{
        const resposta = await fetch("/api/cardapio");
        categorias = await resposta.json();
        if(!Array.isArray(categorias)) categorias = [];
        renderizarFiltros();
      }catch(e){
        console.error(e);
        categorias = [];
        renderizarFiltros();
      }
    }

    function renderizarFiltros(){
      const div = document.getElementById("filtrosCategorias");
      div.innerHTML = categorias.map(c => `
        <label>
          <input type="checkbox" value="${c.nome}" ${filtroCategorias.includes(c.nome) ? "checked" : ""}>
          ${c.nome}
        </label>
      `).join("");
    }

    document.getElementById("btnSalvarFiltro").addEventListener("click", function(){
      const checks = Array.from(document.querySelectorAll("#filtrosCategorias input:checked"));
      filtroCategorias = checks.map(c => c.value);
      localStorage.setItem("filtroCategoriasProducao", JSON.stringify(filtroCategorias));
      renderizarPedidos();
    });

    async function carregarPedidos(){
      try{
        const resposta = await fetch("/api/pedidos");
        pedidos = await resposta.json();
        if(!Array.isArray(pedidos)) pedidos = [];
        renderizarPedidos();
      }catch(e){
        console.error(e);
        pedidos = [];
        renderizarPedidos();
      }
    }

    function pedidoPassaNoFiltro(pedido){
      if(!filtroCategorias.length) return true;
      return (pedido.itens || []).some(item => filtroCategorias.includes(item.categoria));
    }

    function renderizarPedidos(){
      const lista = document.getElementById("listaProducao");

      const exibidos = pedidos.filter(p =>
        p.status !== "Finalizado" &&
        p.status !== "Cancelado" &&
        pedidoPassaNoFiltro(p)
      );

      if(!exibidos.length){
        lista.innerHTML = '<div class="vazio">Nenhum pedido encontrado para as categorias selecionadas.</div>';
        return;
      }

      lista.innerHTML = exibidos.map(p => `
        <div class="pedido">
          <div class="pedido-numero">Pedido #${p.numeroPedido}</div>
          <div class="pedido-info"><strong>Status:</strong> ${badgeStatus(p.statusVisual || p.status)}</div>
          <div class="pedido-info"><strong>Cliente:</strong> ${p.cliente || "-"}</div>
          <div class="pedido-info"><strong>Tipo:</strong> ${p.tipoPedido || "-"}</div>
          <div class="pedido-info"><strong>Mesa:</strong> ${p.mesa || "-"}</div>
          <div class="pedido-info"><strong>Garçom:</strong> ${p.garcom || "-"}</div>
          <div class="pedido-info"><strong>Telefone:</strong> ${p.telefone || "-"}</div>
          <div class="pedido-info"><strong>Endereço:</strong> ${p.endereco || "-"}</div>
          <div class="pedido-info"><strong>Observação:</strong> ${p.observacao || "-"}</div>
          <ul>
            ${(p.itens || [])
              .filter(item => !filtroCategorias.length || filtroCategorias.includes(item.categoria))
              .map(item => `
                <li>${item.quantidade}x ${item.nome} - ${item.categoria || "-"} ${item.observacao ? "| Obs.: " + item.observacao : ""}</li>
              `).join("")}
          </ul>
          <div class="acoes">
            <button class="btn btn-producao" onclick="alterarStatus(${p.id}, 'Em andamento')">Em andamento</button>
            <button class="btn btn-pronto" onclick="alterarStatus(${p.id}, 'Pronto')">Pronto</button>
          </div>
        </div>
      `).join("");
    }

    window.alterarStatus = async function(id, statusVisual){
      try{
        const resposta = await fetch("/api/pedidos/" + id + "/status", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ statusVisual })
        });

        const dados = await resposta.json();
        if(!dados.sucesso){
          alert(dados.erro || "Erro ao alterar status.");
          return;
        }

        carregarPedidos();
      }catch(e){
        console.error(e);
        alert("Erro ao alterar status.");
      }
    };

    document.getElementById("btnSair").addEventListener("click", function(){
      localStorage.removeItem("sessaoSistemaPedido");
      window.location.href = "/login.html";
    });

    socket.on("pedidoAtualizado", function(){ carregarPedidos(); });
    socket.on("novoPedido", function(){ tocarAlerta(); carregarPedidos(); });
    socket.on("cardapioAtualizado", function(){ carregarCategorias(); });

    carregarCategorias();
    carregarPedidos();
  </script>
</body>
</html>
